<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIELD-TESSELLATION</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060610; color: #c0c8d8; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; }
#stats {
  position: fixed; top: 10px; right: 10px; background: rgba(6,6,16,0.85);
  border: 1px solid #f0a; padding: 12px 16px; font-size: 13px; line-height: 1.7;
  border-radius: 4px; min-width: 200px; z-index: 10;
}
#stats .label { color: #888; }
#stats .value { color: #f0a; }
#controls {
  position: fixed; bottom: 10px; left: 10px; background: rgba(6,6,16,0.85);
  border: 1px solid #f0a; padding: 12px 16px; border-radius: 4px; z-index: 10;
}
#controls button {
  background: transparent; color: #f0a; border: 1px solid #f0a;
  padding: 6px 14px; margin: 3px; cursor: pointer; font-family: 'Courier New', monospace;
  font-size: 12px; border-radius: 3px; transition: all 0.2s;
}
#controls button:hover, #controls button.active {
  background: #f0a; color: #060610;
}
#controls .row { margin: 4px 0; }
#controls .ctrl-label { color: #888; font-size: 11px; margin-bottom: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">
  <div><span class="label">SHIELD-TESSELLATION</span></div>
  <div><span class="label">pattern: </span><span class="value" id="s-pattern">triangular</span></div>
  <div><span class="label">tiles: </span><span class="value" id="s-tiles">0</span></div>
  <div><span class="label">hue shift: </span><span class="value" id="s-hue">0</span></div>
  <div><span class="label">fps: </span><span class="value" id="s-fps">0</span></div>
</div>
<div id="controls">
  <div class="ctrl-label">TESSELLATION TYPE</div>
  <div class="row">
    <button class="active" onclick="setPattern('triangular')">TRIANGULAR</button>
    <button onclick="setPattern('square')">SQUARE</button>
    <button onclick="setPattern('hexagonal')">HEXAGONAL</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button onclick="togglePause()">PAUSE</button>
    <button onclick="cycleSpeed()">SPEED</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let pattern = 'triangular';
let hueOffset = 0;
let speed = 1;
let paused = false;
let tileCount = 0;
let lastTime = 0, fps = 0, frameCount = 0, fpsTime = 0;

function setPattern(p) {
  pattern = p;
  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('s-pattern').textContent = p;
}
function togglePause() { paused = !paused; }
function cycleSpeed() { speed = speed >= 4 ? 0.5 : speed * 2; }

function hsl(h, s, l, a) {
  return `hsla(${h % 360}, ${s}%, ${l}%, ${a || 1})`;
}

function drawTriangular() {
  const size = 40;
  const h = size * Math.sqrt(3) / 2;
  let count = 0;
  for (let row = -1; row * h < H + h; row++) {
    for (let col = -1; col * size < W + size * 2; col++) {
      const x = col * size + (row % 2 ? size / 2 : 0);
      const y = row * h;
      // Upward triangle
      const hue = (x * 0.5 + y * 0.3 + hueOffset) % 360;
      ctx.fillStyle = hsl(hue, 70, 35, 0.8);
      ctx.strokeStyle = hsl(hue, 80, 55, 0.6);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x + size / 2, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      count++;
      // Downward triangle
      const hue2 = (x * 0.5 + y * 0.3 + hueOffset + 180) % 360;
      ctx.fillStyle = hsl(hue2, 70, 25, 0.8);
      ctx.strokeStyle = hsl(hue2, 80, 45, 0.6);
      ctx.beginPath();
      ctx.moveTo(x + size / 2, y);
      ctx.lineTo(x + size * 1.5, y);
      ctx.lineTo(x + size, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      count++;
    }
  }
  return count;
}

function drawSquare() {
  const size = 50;
  let count = 0;
  for (let row = -1; row * size < H + size; row++) {
    for (let col = -1; col * size < W + size; col++) {
      const x = col * size;
      const y = row * size;
      const hue = (col * 15 + row * 15 + hueOffset) % 360;
      const checker = (col + row) % 2;
      ctx.fillStyle = hsl(hue, 65, checker ? 30 : 22, 0.85);
      ctx.strokeStyle = hsl(hue, 80, 50, 0.5);
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, size, size);
      ctx.strokeRect(x, y, size, size);
      count++;
    }
  }
  return count;
}

function drawHexagonal() {
  const size = 30;
  const w = size * 2;
  const h = size * Math.sqrt(3);
  let count = 0;
  for (let row = -1; row * h * 0.75 < H + h; row++) {
    for (let col = -1; col * w * 0.75 < W + w; col++) {
      const x = col * w * 0.75;
      const y = row * h + (col % 2 ? h / 2 : 0);
      const hue = (col * 20 + row * 20 + hueOffset) % 360;
      ctx.fillStyle = hsl(hue, 60, 28, 0.85);
      ctx.strokeStyle = hsl(hue, 80, 55, 0.6);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i - Math.PI / 6;
        const px = x + size * Math.cos(angle);
        const py = y + size * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      count++;
    }
  }
  return count;
}

function animate(time) {
  requestAnimationFrame(animate);
  frameCount++;
  if (time - fpsTime > 1000) { fps = frameCount; frameCount = 0; fpsTime = time; }

  if (!paused) hueOffset += speed * 0.5;

  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, W, H);

  if (pattern === 'triangular') tileCount = drawTriangular();
  else if (pattern === 'square') tileCount = drawSquare();
  else tileCount = drawHexagonal();

  // Title
  ctx.fillStyle = '#f0a';
  ctx.font = 'bold 14px Courier New';
  ctx.fillText('SHIELD-TESSELLATION', 15, 25);

  document.getElementById('s-tiles').textContent = tileCount;
  document.getElementById('s-hue').textContent = Math.floor(hueOffset);
  document.getElementById('s-fps').textContent = fps;
}
requestAnimationFrame(animate);
</script>
</body>
</html>

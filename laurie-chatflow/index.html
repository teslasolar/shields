<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAURIE · CHATFLOW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060610}
canvas{display:block;width:100%;height:100%}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:8px;letter-spacing:2px;color:#0ff;opacity:0.7;text-align:center;pointer-events:none;line-height:2}
#prompt-box{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
#prompt-input{background:rgba(0,255,255,0.05);border:1px solid rgba(0,255,255,0.2);color:#0ff;font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;padding:6px 12px;border-radius:4px;width:300px;outline:none}
#prompt-input:focus{border-color:rgba(0,255,255,0.4)}
#prompt-input::placeholder{color:#0ff4}
#gen-btn{background:rgba(0,255,255,0.1);border:1px solid rgba(0,255,255,0.3);color:#0ff;font-family:'Courier New',monospace;font-size:8px;letter-spacing:2px;padding:6px 14px;cursor:pointer;border-radius:4px}
#gen-btn:hover{background:rgba(0,255,255,0.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="prompt-box">
  <input id="prompt-input" type="text" placeholder="TYPE A PROMPT..." value="Once upon a time in a">
  <button id="gen-btn" onclick="startGeneration()">GENERATE</button>
</div>
<div id="info">LAURIE · CHATFLOW · TOKEN BY TOKEN MAGIC<br>PROBABILITY RAINBOWS SHOW WHICH WORD COMES NEXT</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const TAU = Math.PI * 2;
let W, H, t = 0;

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Vocabulary for fun fake generation
const VOCAB = {
  'Once': ['upon', 'there', 'in', 'when'],
  'upon': ['a', 'the', 'this', 'that'],
  'a': ['time', 'magical', 'distant', 'beautiful', 'neural', 'quantum'],
  'time': ['in', 'there', 'when', 'a', ','],
  'in': ['a', 'the', 'deep', 'outer', 'digital'],
  'the': ['magical', 'ancient', 'digital', 'neural', 'quantum', 'beautiful', 'shimmering'],
  'there': ['lived', 'was', 'existed', 'dwelt'],
  'lived': ['a', 'an', 'the'],
  'was': ['a', 'an', 'the', 'once', 'always'],
  'magical': ['kingdom', 'forest', 'network', 'algorithm', 'garden'],
  'kingdom': ['where', 'of', 'that', 'filled'],
  'forest': ['where', 'of', 'filled', 'deep'],
  'where': ['neural', 'quantum', 'digital', 'magical', 'bright'],
  'neural': ['networks', 'pathways', 'dreams', 'sparks', 'connections'],
  'networks': ['danced', 'learned', 'grew', 'shimmered', 'connected'],
  'danced': ['with', 'through', 'among', 'between'],
  'with': ['light', 'joy', 'colors', 'data', 'wonder'],
  'light': ['and', 'that', 'which', 'so', '.'],
  'and': ['beauty', 'wonder', 'harmony', 'love', 'music'],
  'quantum': ['dreams', 'sparks', 'fields', 'particles'],
  'digital': ['garden', 'dreams', 'rivers', 'stars'],
  'beautiful': ['garden', 'dream', 'world', 'pattern'],
  'garden': ['of', 'where', 'filled', 'blooming'],
  'of': ['light', 'dreams', 'stars', 'wonder', 'code'],
  'dreams': ['and', 'that', 'where', 'filled', '.'],
  'deep': ['within', 'inside', 'below', 'beyond'],
  'shimmering': ['crystals', 'lights', 'patterns', 'waves'],
  'bright': ['stars', 'lights', 'colors', 'sparks'],
  'ancient': ['wisdom', 'code', 'patterns', 'knowledge'],
};

// Default fallback
const FALLBACK = ['and', 'the', 'of', 'with', 'in', 'a', 'that', 'where'];

const COLORS = ['#0ff', '#f4a', '#fc0', '#8f4', '#a4f', '#4af', '#f84'];

let generatedTokens = [];
let currentCandidates = [];
let isGenerating = false;
let genTimer = 0;
let genSpeed = 0.8; // seconds per token
let particles = [];

class TokenParticle {
  constructor(x, y, word, color) {
    this.x = x;
    this.y = y;
    this.targetX = x;
    this.targetY = y;
    this.word = word;
    this.color = color;
    this.alpha = 0;
    this.scale = 0;
    this.age = 0;
  }
  update() {
    this.age += 0.016;
    this.alpha = Math.min(1, this.alpha + 0.05);
    this.scale = Math.min(1, this.scale + 0.08);
    this.x += (this.targetX - this.x) * 0.1;
    this.y += (this.targetY - this.y) * 0.1;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    ctx.font = '14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = this.color + Math.round(this.alpha * 200).toString(16).padStart(2, '0');
    ctx.fillText(this.word, 0, 5);

    // Glow
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
    glow.addColorStop(0, this.color + '11');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(-30, -30, 60, 60);
    ctx.restore();
  }
}

function getNextCandidates(word) {
  const options = VOCAB[word] || FALLBACK;
  // Generate probabilities (fake softmax-like)
  const raw = options.map(() => Math.random() * 3 + 0.1);
  const sum = raw.reduce((a, b) => a + b, 0);
  return options.map((w, i) => ({
    word: w,
    prob: raw[i] / sum,
    color: COLORS[i % COLORS.length]
  })).sort((a, b) => b.prob - a.prob);
}

function startGeneration() {
  const input = document.getElementById('prompt-input').value.trim();
  if (!input) return;

  generatedTokens = input.split(' ');
  particles = [];
  isGenerating = true;
  genTimer = 0;

  // Position initial tokens
  layoutTokens();

  // Get first candidates
  const lastWord = generatedTokens[generatedTokens.length - 1];
  currentCandidates = getNextCandidates(lastWord);
}

function layoutTokens() {
  const startX = 60;
  const y = H * 0.45;
  const spacing = 90;
  const maxPerRow = Math.floor((W - 120) / spacing);

  particles = [];
  for (let i = 0; i < generatedTokens.length; i++) {
    const row = Math.floor(i / maxPerRow);
    const col = i % maxPerRow;
    const p = new TokenParticle(
      startX + col * spacing,
      y + row * 40,
      generatedTokens[i],
      i < generatedTokens.length - 1 ? '#668' : '#0ff'
    );
    p.alpha = i < generatedTokens.length - 1 ? 0.5 : 1;
    p.scale = 1;
    particles.push(p);
  }
}

function addToken(word) {
  generatedTokens.push(word);
  layoutTokens();

  // Recolor - latest token bright, rest dim
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (i === particles.length - 1) {
      p.color = '#0ff';
      p.alpha = 0;
      p.scale = 0;
    } else {
      p.color = '#668';
      p.alpha = 0.5;
    }
  }

  // New candidates
  currentCandidates = getNextCandidates(word);
}

function drawCandidates() {
  if (currentCandidates.length === 0) return;

  const baseX = W * 0.65;
  const baseY = H * 0.15;

  ctx.font = '8px Courier New';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,255,255,0.4)';
  ctx.fillText('NEXT TOKEN PROBABILITIES:', baseX, baseY - 10);

  for (let i = 0; i < currentCandidates.length; i++) {
    const c = currentCandidates[i];
    const y = baseY + i * 32;

    // Probability bar background
    ctx.fillStyle = 'rgba(20,25,40,0.4)';
    ctx.fillRect(baseX, y, 200, 20);

    // Probability bar fill
    const barW = c.prob * 200;
    ctx.fillStyle = c.color + '44';
    ctx.fillRect(baseX, y, barW, 20);
    ctx.strokeStyle = c.color + '66';
    ctx.strokeRect(baseX, y, barW, 20);

    // Word label
    ctx.font = '11px Courier New';
    ctx.textAlign = 'left';
    ctx.fillStyle = c.color;
    ctx.fillText(c.word, baseX + 6, y + 14);

    // Percentage
    ctx.font = '9px Courier New';
    ctx.textAlign = 'right';
    ctx.fillStyle = c.color + 'aa';
    ctx.fillText((c.prob * 100).toFixed(1) + '%', baseX + 195, y + 14);

    // Rainbow bar segment
    const segW = barW;
    const grad = ctx.createLinearGradient(baseX, 0, baseX + segW, 0);
    grad.addColorStop(0, c.color + '33');
    grad.addColorStop(1, c.color + '00');
    ctx.fillStyle = grad;
    ctx.fillRect(baseX, y, segW, 20);
  }

  // Selection arrow animation
  const selectedIdx = 0; // always picks top
  const arrowY = baseY + selectedIdx * 32 + 10;
  const arrowPulse = Math.sin(t * 4) * 3;
  ctx.font = '12px Courier New';
  ctx.textAlign = 'right';
  ctx.fillStyle = `rgba(0,255,255,${0.3 + Math.sin(t * 3) * 0.2})`;
  ctx.fillText('▶', baseX - 6 + arrowPulse, arrowY + 4);
}

// Beam search tree visualization
function drawBeamTree() {
  if (generatedTokens.length < 2) return;

  const ox = 30;
  const oy = H * 0.7;
  ctx.font = '7px Courier New';
  ctx.fillStyle = 'rgba(0,255,255,0.3)';
  ctx.textAlign = 'left';
  ctx.fillText('BEAM SEARCH TREE (k=3)', ox, oy - 10);

  const recent = generatedTokens.slice(-4);
  let x = ox;
  for (let i = 0; i < recent.length; i++) {
    const y = oy + 20;

    // Node
    ctx.fillStyle = i === recent.length - 1 ? '#0ff' : '#668';
    ctx.font = '9px Courier New';
    ctx.fillText(recent[i], x, y);

    const textW = ctx.measureText(recent[i]).width;

    // Branches (pruned beams shown as faded)
    if (i < recent.length - 1) {
      // Main beam
      ctx.strokeStyle = 'rgba(0,255,255,0.2)';
      ctx.beginPath();
      ctx.moveTo(x + textW + 4, y - 3);
      ctx.lineTo(x + textW + 20, y - 3);
      ctx.stroke();

      // Pruned alternatives
      for (let b = 1; b < 3; b++) {
        const by = y + b * 15;
        ctx.fillStyle = 'rgba(100,100,130,0.2)';
        ctx.font = '8px Courier New';
        const altWord = (VOCAB[recent[i]] || FALLBACK)[b] || '...';
        ctx.fillText(altWord, x, by);

        // Pruned line
        ctx.strokeStyle = 'rgba(255,100,100,0.1)';
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(x + 30, by - 3);
        ctx.lineTo(x + 45, by - 3);
        ctx.stroke();
        ctx.setLineDash([]);

        // X mark
        ctx.fillStyle = 'rgba(255,100,100,0.2)';
        ctx.fillText('✕', x + 48, by);
      }
    }

    x += textW + 28;
  }
}

// Floating sparkle particles for visual fun
const sparkles = [];
for (let i = 0; i < 50; i++) {
  sparkles.push({
    x: Math.random() * 2000,
    y: Math.random() * 1200,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -Math.random() * 0.5 - 0.1,
    size: Math.random() * 2 + 0.5,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    phase: Math.random() * TAU
  });
}

function drawSparkles() {
  for (const s of sparkles) {
    s.x += s.vx;
    s.y += s.vy;
    if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; }
    if (s.x < -10 || s.x > W + 10) s.x = Math.random() * W;

    const alpha = 0.2 + 0.15 * Math.sin(t * 2 + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, TAU);
    ctx.fillStyle = s.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();
  }
}

function draw() {
  t += 0.016;
  ctx.fillStyle = 'rgba(6,6,16,0.15)';
  ctx.fillRect(0, 0, W, H);

  drawSparkles();

  // Auto-generate tokens
  if (isGenerating && generatedTokens.length < 30) {
    genTimer += 0.016;
    if (genTimer >= genSpeed) {
      genTimer = 0;
      // Pick top candidate (temperature sampling simulation)
      if (currentCandidates.length > 0) {
        // Usually pick top, sometimes second
        const pick = Math.random() < 0.7 ? 0 : Math.min(1, currentCandidates.length - 1);
        addToken(currentCandidates[pick].word);
      }
    }
  }

  // Draw tokens
  for (const p of particles) {
    p.update();
    p.draw();
  }

  drawCandidates();
  drawBeamTree();

  requestAnimationFrame(draw);
}

// Auto-start
startGeneration();
draw();
</script>
</body>
</html>

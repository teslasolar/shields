<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIELD-HÉNON — Hénon Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060610; overflow: hidden; font-family: 'Courier New', monospace; cursor: crosshair; color: #f84; }
canvas { display: block; }
#stats {
  position: fixed; top: 16px; right: 16px;
  background: rgba(6,6,16,0.85); border: 1px solid #f84;
  padding: 14px 18px; font-size: 13px; line-height: 1.7;
  color: #ccc; min-width: 240px; z-index: 10;
}
#stats .title { color: #f84; font-size: 14px; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; }
#stats .val { color: #fff; }
#controls {
  position: fixed; bottom: 16px; left: 16px;
  background: rgba(6,6,16,0.85); border: 1px solid #f84;
  padding: 14px 18px; font-size: 12px; line-height: 2.2;
  color: #ccc; z-index: 10; min-width: 280px;
}
#controls .title { color: #f84; font-size: 14px; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; }
#controls label { display: flex; align-items: center; gap: 8px; }
#controls input[type="range"] {
  -webkit-appearance: none; appearance: none; height: 4px;
  background: #333; outline: none; flex: 1;
}
#controls input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: #f84; border-radius: 50%; cursor: pointer;
}
#controls button {
  background: transparent; border: 1px solid #f84; color: #f84;
  padding: 4px 14px; font-family: inherit; font-size: 12px;
  cursor: pointer; margin-top: 4px; margin-right: 6px;
}
#controls button:hover { background: #f84; color: #060610; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="stats">
  <div class="title">SHIELD-HÉNON</div>
  <div>a: <span class="val" id="sa">1.400</span></div>
  <div>b: <span class="val" id="sb">0.300</span></div>
  <div>iterations: <span class="val" id="si">0</span></div>
  <div>x range: <span class="val" id="sxr">—</span></div>
  <div>y range: <span class="val" id="syr">—</span></div>
  <div>zoom: <span class="val" id="sz">1.00x</span></div>
</div>

<div id="controls">
  <div class="title">CONTROLS</div>
  <label>a <input type="range" id="ca" min="0.5" max="1.8" step="0.005" value="1.4"> <span id="cav">1.400</span></label>
  <label>b <input type="range" id="cb" min="0.0" max="0.5" step="0.005" value="0.3"> <span id="cbv">0.300</span></label>
  <label>zoom <input type="range" id="cz" min="0" max="5" step="0.1" value="0"> <span id="czv">1.0x</span></label>
  <label>iters <input type="range" id="ci" min="5000" max="200000" step="5000" value="50000"> <span id="civ">50000</span></label>
  <button id="reset">RESET</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  needsRedraw = true;
}
resize();
window.addEventListener('resize', resize);

let paramA = 1.4, paramB = 0.3;
let zoomLevel = 0;
let maxIter = 50000;
let needsRedraw = true;

// View center for zoom
let viewCX = 0, viewCY = 0;

// For bounding box stats
let xMin, xMax, yMin, yMax;

// Mouse for zoom target
let mouseX = W/2, mouseY = H/2;
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomSlider = document.getElementById('cz');
  let val = parseFloat(zoomSlider.value) + (e.deltaY > 0 ? -0.2 : 0.2);
  val = Math.max(0, Math.min(5, val));
  zoomSlider.value = val;
  zoomLevel = val;
  document.getElementById('czv').textContent = Math.pow(2, val).toFixed(1) + 'x';

  // Update view center toward mouse
  const zoom = Math.pow(2, zoomLevel);
  const baseScale = Math.min(W, H) / 4;
  const scale = baseScale * zoom;
  viewCX = (mouseX - W/2) / scale * 0.3 + viewCX * 0.7;
  viewCY = -(mouseY - H/2) / scale * 0.3 + viewCY * 0.7;

  needsRedraw = true;
}, { passive: false });

function computeHenon() {
  const points = [];
  xMin = Infinity; xMax = -Infinity;
  yMin = Infinity; yMax = -Infinity;

  // Use multiple starting points to fill the attractor
  const starts = [
    [0.1, 0.1], [0.0, 0.0], [-0.1, 0.1], [0.2, -0.1],
    [0.5, 0.0], [-0.5, 0.0], [0.0, 0.3], [0.0, -0.3]
  ];

  const itersPerStart = Math.ceil(maxIter / starts.length);

  for (let s = 0; s < starts.length; s++) {
    let x = starts[s][0], y = starts[s][1];
    // Skip transient
    for (let i = 0; i < 200; i++) {
      const xn = 1 - paramA * x * x + y;
      const yn = paramB * x;
      x = xn; y = yn;
      if (Math.abs(x) > 1e10) { x = 0.1; y = 0.1; }
    }

    for (let i = 0; i < itersPerStart; i++) {
      const xn = 1 - paramA * x * x + y;
      const yn = paramB * x;
      x = xn; y = yn;
      if (Math.abs(x) > 1e10 || isNaN(x)) { x = 0.1; y = 0.1; continue; }
      points.push([x, y, i + s * itersPerStart]);
      if (x < xMin) xMin = x;
      if (x > xMax) xMax = x;
      if (y < yMin) yMin = y;
      if (y > yMax) yMax = y;
    }
  }

  return points;
}

function drawHenon() {
  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, W, H);

  // Draw grid
  const zoom = Math.pow(2, zoomLevel);
  const baseScale = Math.min(W, H) / 4;
  const scale = baseScale * zoom;

  ctx.strokeStyle = 'rgba(255,136,68,0.06)';
  ctx.lineWidth = 0.5;
  const gridStep = zoom < 2 ? 0.5 : (zoom < 8 ? 0.2 : 0.1);
  for (let gx = -3; gx <= 3; gx += gridStep) {
    const sx = W/2 + (gx - viewCX) * scale;
    if (sx < 0 || sx > W) continue;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }
  for (let gy = -3; gy <= 3; gy += gridStep) {
    const sy = H/2 - (gy - viewCY) * scale;
    if (sy < 0 || sy > H) continue;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = 'rgba(255,136,68,0.15)';
  ctx.lineWidth = 1;
  const ox = W/2 + (-viewCX) * scale;
  const oy = H/2 - (-viewCY) * scale;
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();

  const points = computeHenon();
  const totalPts = points.length;

  // Draw points colored by age
  for (let i = 0; i < totalPts; i++) {
    const px = W/2 + (points[i][0] - viewCX) * scale;
    const py = H/2 - (points[i][1] - viewCY) * scale;

    if (px < -5 || px > W+5 || py < -5 || py > H+5) continue;

    const age = points[i][2] / maxIter;
    const hue = (age * 300 + 15) % 360;
    const alpha = 0.4 + age * 0.4;

    ctx.fillStyle = `hsla(${hue}, 100%, 65%, ${alpha})`;
    ctx.fillRect(px, py, 1.2, 1.2);
  }

  // Stats
  document.getElementById('sa').textContent = paramA.toFixed(3);
  document.getElementById('sb').textContent = paramB.toFixed(3);
  document.getElementById('si').textContent = totalPts.toLocaleString();
  document.getElementById('sxr').textContent = isFinite(xMin) ? `[${xMin.toFixed(3)}, ${xMax.toFixed(3)}]` : '—';
  document.getElementById('syr').textContent = isFinite(yMin) ? `[${yMin.toFixed(3)}, ${yMax.toFixed(3)}]` : '—';
  document.getElementById('sz').textContent = zoom.toFixed(2) + 'x';
}

// Animate with slow glow pulse
let frame = 0;
function animate() {
  frame++;
  if (needsRedraw || frame % 120 === 0) {
    drawHenon();
    needsRedraw = false;
  }

  // Subtle glow on existing points - redraw every N frames with slight variation
  if (frame % 60 === 0) {
    // Add a subtle scan line effect
    ctx.fillStyle = 'rgba(255,136,68,0.01)';
    const scanY = (frame * 2) % H;
    ctx.fillRect(0, scanY, W, 2);
  }

  requestAnimationFrame(animate);
}

// Controls
document.getElementById('ca').addEventListener('input', e => {
  paramA = parseFloat(e.target.value);
  document.getElementById('cav').textContent = paramA.toFixed(3);
  needsRedraw = true;
});
document.getElementById('cb').addEventListener('input', e => {
  paramB = parseFloat(e.target.value);
  document.getElementById('cbv').textContent = paramB.toFixed(3);
  needsRedraw = true;
});
document.getElementById('cz').addEventListener('input', e => {
  zoomLevel = parseFloat(e.target.value);
  document.getElementById('czv').textContent = Math.pow(2, zoomLevel).toFixed(1) + 'x';
  needsRedraw = true;
});
document.getElementById('ci').addEventListener('input', e => {
  maxIter = parseInt(e.target.value);
  document.getElementById('civ').textContent = maxIter;
  needsRedraw = true;
});

document.getElementById('reset').addEventListener('click', () => {
  paramA = 1.4; paramB = 0.3; zoomLevel = 0; maxIter = 50000;
  viewCX = 0; viewCY = 0;
  document.getElementById('ca').value = 1.4; document.getElementById('cav').textContent = '1.400';
  document.getElementById('cb').value = 0.3; document.getElementById('cbv').textContent = '0.300';
  document.getElementById('cz').value = 0; document.getElementById('czv').textContent = '1.0x';
  document.getElementById('ci').value = 50000; document.getElementById('civ').textContent = '50000';
  needsRedraw = true;
});

animate();
</script>
</body>
</html>

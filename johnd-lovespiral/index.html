<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOHND · LOVE SPIRAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0008}
canvas{display:block;width:100%;height:100%}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:8px;letter-spacing:2px;color:#f06;opacity:0.6;text-align:center;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">JOHND · LOVE SPIRAL · TWO SOULS DANCING IN FIBONACCI LIGHT</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const TAU = Math.PI * 2;
const PHI = (1 + Math.sqrt(5)) / 2;
let W, H, cx, cy, t = 0;

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// Heart-shaped particles
const hearts = [];
const MAX_HEARTS = 200;

class HeartParticle {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = 1;
    this.size = 2 + Math.random() * 4;
    this.hue = Math.random() * 30 - 15; // slight hue variation around pink
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.02; // gentle gravity
    this.vx *= 0.99;
    this.life -= 0.006;
  }
  draw() {
    if (this.life <= 0) return;
    const s = this.size * this.life;
    const alpha = this.life * 0.6;
    // Mini heart shape
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(s / 10, s / 10);
    ctx.beginPath();
    ctx.moveTo(0, -3);
    ctx.bezierCurveTo(-5, -8, -10, -2, 0, 5);
    ctx.bezierCurveTo(10, -2, 5, -8, 0, -3);
    ctx.fillStyle = `hsla(${340 + this.hue},90%,65%,${alpha})`;
    ctx.fill();
    ctx.restore();
  }
}

// Twin golden spirals
function goldenSpiral(angle, scale) {
  const r = scale * Math.pow(PHI, angle / (TAU / 4));
  return r;
}

// Spiral trail points
const trail1 = [];
const trail2 = [];
const TRAIL_LEN = 300;

function draw() {
  t += 0.008;

  ctx.fillStyle = 'rgba(10,0,8,0.06)';
  ctx.fillRect(0, 0, W, H);

  const baseScale = Math.min(W, H) * 0.0015;

  // Two spirals orbiting each other
  const orbitR = 40 + Math.sin(t * 0.3) * 15;
  const orbitAngle = t * 0.4;

  // Spiral 1 position (traces a golden spiral)
  const spiralAngle1 = t * 2;
  const r1 = goldenSpiral(spiralAngle1 % (TAU * 3), baseScale);
  const clampR1 = Math.min(r1, Math.min(W, H) * 0.4);
  const x1 = cx + Math.cos(spiralAngle1) * clampR1 + Math.cos(orbitAngle) * orbitR;
  const y1 = cy + Math.sin(spiralAngle1) * clampR1 + Math.sin(orbitAngle) * orbitR;

  // Spiral 2 (mirror, opposite orbit)
  const spiralAngle2 = t * 2 + Math.PI;
  const r2 = goldenSpiral(spiralAngle2 % (TAU * 3), baseScale);
  const clampR2 = Math.min(r2, Math.min(W, H) * 0.4);
  const x2 = cx + Math.cos(spiralAngle2) * clampR2 - Math.cos(orbitAngle) * orbitR;
  const y2 = cy + Math.sin(spiralAngle2) * clampR2 - Math.sin(orbitAngle) * orbitR;

  // Distance between them — closer = brighter
  const dist = Math.sqrt((x1 - x2) ** 2 + (y1 - y2) ** 2);
  const closeness = Math.max(0, 1 - dist / 300);

  // Add trail points
  trail1.push({ x: x1, y: y1 });
  trail2.push({ x: x2, y: y2 });
  if (trail1.length > TRAIL_LEN) trail1.shift();
  if (trail2.length > TRAIL_LEN) trail2.shift();

  // Draw connection beam between the two
  if (closeness > 0.1) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(255,0,100,${closeness * 0.3})`;
    ctx.lineWidth = closeness * 4;
    ctx.stroke();

    // Love glow at midpoint
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const glow = ctx.createRadialGradient(mx, my, 0, mx, my, 50 + closeness * 50);
    glow.addColorStop(0, `rgba(255,50,120,${closeness * 0.15})`);
    glow.addColorStop(0.5, `rgba(255,100,180,${closeness * 0.05})`);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(mx - 100, my - 100, 200, 200);
  }

  // Draw trails
  function drawTrail(trail, color1, color2) {
    for (let i = 1; i < trail.length; i++) {
      const progress = i / trail.length;
      const alpha = progress * 0.5;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      const r = Math.round(parseInt(color1.slice(1, 3), 16) * (1 - progress) + parseInt(color2.slice(1, 3), 16) * progress);
      const g = Math.round(parseInt(color1.slice(3, 5), 16) * (1 - progress) + parseInt(color2.slice(3, 5), 16) * progress);
      const b = Math.round(parseInt(color1.slice(5, 7), 16) * (1 - progress) + parseInt(color2.slice(5, 7), 16) * progress);
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = 1 + progress * 2;
      ctx.stroke();
    }
  }
  drawTrail(trail1, '#ff0066', '#ffcc00');
  drawTrail(trail2, '#ff66aa', '#ff4488');

  // Spiral head glows
  for (const [x, y, color] of [[x1, y1, '#f06'], [x2, y2, '#f4a']]) {
    const brightness = 0.6 + closeness * 0.4;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 25 + closeness * 20);
    glow.addColorStop(0, color + Math.round(brightness * 200).toString(16).padStart(2, '0'));
    glow.addColorStop(0.4, color + '33');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(x - 45, y - 45, 90, 90);

    ctx.beginPath();
    ctx.arc(x, y, 5 + closeness * 3, 0, TAU);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Emit heart particles from both spirals
  if (Math.random() < 0.3 + closeness * 0.5) {
    const fromX = Math.random() > 0.5 ? x1 : x2;
    const fromY = Math.random() > 0.5 ? y1 : y2;
    hearts.push(new HeartParticle(
      fromX, fromY,
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2 - 1
    ));
  }
  if (hearts.length > MAX_HEARTS) hearts.splice(0, hearts.length - MAX_HEARTS);

  // Update and draw hearts
  for (let i = hearts.length - 1; i >= 0; i--) {
    hearts[i].update();
    hearts[i].draw();
    if (hearts[i].life <= 0) hearts.splice(i, 1);
  }

  // Central Fibonacci love pattern
  const rings = 7;
  for (let ring = 0; ring < rings; ring++) {
    const ringR = 30 + ring * 18;
    const n = Math.round(ring * PHI * 3) + 5;
    const ringAlpha = 0.04 + closeness * 0.06;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + t * (0.1 + ring * 0.02) * (ring % 2 ? 1 : -1);
      const px = cx + Math.cos(a) * ringR;
      const py = cy + Math.sin(a) * ringR;
      ctx.beginPath();
      ctx.arc(px, py, 1.2, 0, TAU);
      ctx.fillStyle = `hsla(${340 + ring * 5},80%,65%,${ringAlpha})`;
      ctx.fill();
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

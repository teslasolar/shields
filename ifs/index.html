<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIELD-IFS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060610; color: #c0c8d8; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; }
#stats {
  position: fixed; top: 16px; right: 16px;
  background: rgba(6,6,16,0.88); border: 1px solid #f84;
  padding: 14px 18px; font-size: 13px; line-height: 1.7;
  min-width: 280px; z-index: 10; border-radius: 4px;
}
#stats .title { color: #f84; font-size: 15px; font-weight: bold; margin-bottom: 6px; }
#stats .label { color: #888; }
#stats .val { color: #f84; }
#stats .matrix { font-size: 11px; margin-top: 6px; border-top: 1px solid #222; padding-top: 6px; }
#stats .matrix div { margin: 1px 0; }
#controls {
  position: fixed; bottom: 16px; left: 16px;
  background: rgba(6,6,16,0.88); border: 1px solid #f84;
  padding: 14px 18px; font-size: 13px; z-index: 10; border-radius: 4px;
}
#controls .title { color: #f84; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
#controls button {
  background: rgba(255,136,68,0.15); border: 1px solid #f84; color: #f84;
  padding: 5px 14px; margin: 3px 4px 3px 0; cursor: pointer; font-family: inherit;
  font-size: 12px; border-radius: 3px; transition: background 0.2s;
}
#controls button:hover { background: rgba(255,136,68,0.35); }
#controls button.active { background: rgba(255,136,68,0.45); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">
  <div class="title">SHIELD-IFS</div>
  <div><span class="label">Category:</span> <span class="val">Fractals</span></div>
  <div><span class="label">Preset:</span> <span class="val" id="sPreset">Fern</span></div>
  <div><span class="label">Points:</span> <span class="val" id="sPoints">0</span></div>
  <div><span class="label">Rate:</span> <span class="val" id="sRate">400/frame</span></div>
  <div><span class="label">FPS:</span> <span class="val" id="sFps">0</span></div>
  <div class="matrix" id="matrixInfo"></div>
</div>
<div id="controls">
  <div class="title">Controls</div>
  <div>
    <button id="btnFern" class="active">Fern</button>
    <button id="btnTree">Tree</button>
    <button id="btnSpiral">Spiral</button>
    <button id="btnCrystal">Crystal</button>
  </div>
  <div style="margin-top:4px;">
    <button id="btnClear">Clear</button>
    <button id="btnFaster">Faster</button>
    <button id="btnSlower">Slower</button>
    <button id="btnPause">Pause</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; clear(); }
window.addEventListener('resize', resize);

// IFS transforms: [a, b, c, d, e, f, prob]
// x' = a*x + b*y + e
// y' = c*x + d*y + f
const ifsPresets = {
  fern: {
    name: 'Fern',
    transforms: [
      [0, 0, 0, 0.16, 0, 0, 0.01],
      [0.85, 0.04, -0.04, 0.85, 0, 1.6, 0.85],
      [0.2, -0.26, 0.23, 0.22, 0, 1.6, 0.07],
      [-0.15, 0.28, 0.26, 0.24, 0, 0.44, 0.07]
    ],
    xRange: [-2.5, 2.7], yRange: [0, 10]
  },
  tree: {
    name: 'Tree',
    transforms: [
      [0.05, 0, 0, 0.6, 0, 0, 0.10],
      [0.05, 0, 0, -0.5, 0, 1.0, 0.10],
      [0.46, -0.32, 0.39, 0.38, 0, 0.6, 0.20],
      [0.47, -0.15, 0.17, 0.42, 0, 1.1, 0.20],
      [0.43, 0.28, -0.25, 0.45, 0, 1.0, 0.20],
      [0.42, 0.26, -0.35, 0.31, 0, 0.7, 0.20]
    ],
    xRange: [-1.5, 1.5], yRange: [-0.5, 2.5]
  },
  spiral: {
    name: 'Spiral',
    transforms: [
      [0.7886, -0.4249, 0.2426, 0.8594, 1.7586, 1.4084, 0.90],
      [-0.1212, 0.2568, 0.1521, 0.0536, -6.7216, 1.3779, 0.05],
      [0.1812, -0.0461, 0.0461, 0.1812, 6.0861, 1.568, 0.05]
    ],
    xRange: [-10, 12], yRange: [-2, 12]
  },
  crystal: {
    name: 'Crystal',
    transforms: [
      [0.382, 0, 0, 0.382, 0.3072, 0.619, 0.25],
      [0.382, 0, 0, 0.382, 0.6033, 0.4044, 0.25],
      [0.382, 0, 0, 0.382, 0.0139, 0.4044, 0.25],
      [0.382, 0, 0, 0.382, 0.1253, 0.0595, 0.25]
    ],
    xRange: [-0.1, 1.1], yRange: [-0.1, 1.1]
  }
};

let currentPreset = 'fern';
let x = 0, y = 0;
let totalPoints = 0;
let rate = 400;
let paused = false;
let fps = 0, frameCount = 0, lastFpsTime = performance.now();

function applyTransform(t) {
  const nx = t[0]*x + t[1]*y + t[4];
  const ny = t[2]*x + t[3]*y + t[5];
  x = nx; y = ny;
}

function step() {
  const ifs = ifsPresets[currentPreset];
  const r = Math.random();
  let cumul = 0;
  for (const t of ifs.transforms) {
    cumul += t[6];
    if (r <= cumul) {
      applyTransform(t);
      return;
    }
  }
  applyTransform(ifs.transforms[ifs.transforms.length - 1]);
}

function clear() {
  x = 0; y = 0; totalPoints = 0;
  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, W, H);
  drawTitle();
  updateMatrixInfo();
}

function drawTitle() {
  ctx.fillStyle = '#f84';
  ctx.font = 'bold 16px Courier New';
  ctx.fillText('SHIELD-IFS', 16, 30);
  ctx.font = '12px Courier New';
  ctx.fillStyle = '#555';
  ctx.fillText('Fractals', 16, 48);
}

function updateMatrixInfo() {
  const ifs = ifsPresets[currentPreset];
  let html = '<div><span class="label">Transforms:</span></div>';
  ifs.transforms.forEach((t, i) => {
    html += `<div><span class="val">T${i+1}</span> <span class="label">[${t[0].toFixed(2)} ${t[1].toFixed(2)} | ${t[2].toFixed(2)} ${t[3].toFixed(2)}] p=${(t[6]*100).toFixed(0)}%</span></div>`;
  });
  document.getElementById('matrixInfo').innerHTML = html;
}

function plotPoint() {
  step();
  const ifs = ifsPresets[currentPreset];
  const xr = ifs.xRange, yr = ifs.yRange;
  const margin = 60;
  const rw = xr[1] - xr[0], rh = yr[1] - yr[0];
  const scale = Math.min((W - margin*2)/rw, (H - margin*2)/rh);
  const px = (W - rw*scale)/2 + (x - xr[0])*scale;
  const py = H - margin - (y - yr[0])*scale;

  const t = totalPoints / 50000;
  const hue = 15 + (Math.sin(t) * 0.5 + 0.5) * 25;
  ctx.fillStyle = `hsla(${hue},80%,55%,0.5)`;
  ctx.fillRect(px, py, 1.2, 1.2);
  totalPoints++;
}

function setPreset(key) {
  currentPreset = key;
  document.querySelectorAll('#controls button').forEach(b => {
    if (['btnFern','btnTree','btnSpiral','btnCrystal'].includes(b.id)) b.classList.remove('active');
  });
  clear();
}

document.getElementById('btnFern').onclick = function() { setPreset('fern'); this.classList.add('active'); };
document.getElementById('btnTree').onclick = function() { setPreset('tree'); this.classList.add('active'); };
document.getElementById('btnSpiral').onclick = function() { setPreset('spiral'); this.classList.add('active'); };
document.getElementById('btnCrystal').onclick = function() { setPreset('crystal'); this.classList.add('active'); };
document.getElementById('btnClear').onclick = clear;
document.getElementById('btnFaster').onclick = () => { rate = Math.min(3000, rate + 200); };
document.getElementById('btnSlower').onclick = () => { rate = Math.max(50, rate - 100); };
document.getElementById('btnPause').onclick = function() { paused = !paused; this.textContent = paused ? 'Resume' : 'Pause'; };

function loop() {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) { fps = frameCount; frameCount = 0; lastFpsTime = now; }
  if (!paused) {
    for (let i = 0; i < rate; i++) plotPoint();
  }
  document.getElementById('sPreset').textContent = ifsPresets[currentPreset].name;
  document.getElementById('sPoints').textContent = totalPoints.toLocaleString();
  document.getElementById('sRate').textContent = rate + '/frame';
  document.getElementById('sFps').textContent = fps;
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>

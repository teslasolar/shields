<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIELD-PERCEPTRON</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060610; color: #c0c8d8; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; }
#stats {
  position: fixed; top: 16px; right: 16px; background: rgba(6,6,16,0.92);
  border: 1px solid #a8f; border-radius: 6px; padding: 14px 18px;
  font-size: 13px; line-height: 1.7; min-width: 200px; z-index: 10;
}
#stats .title { color: #a8f; font-size: 15px; font-weight: bold; margin-bottom: 6px; }
#stats .val { color: #a8f; }
#controls {
  position: fixed; bottom: 16px; left: 16px; background: rgba(6,6,16,0.92);
  border: 1px solid #a8f; border-radius: 6px; padding: 14px 18px;
  font-size: 13px; z-index: 10; display: flex; flex-direction: column; gap: 8px;
}
#controls button {
  background: rgba(170,136,255,0.13); color: #a8f; border: 1px solid #a8f;
  border-radius: 4px; padding: 6px 14px; font-family: inherit; font-size: 13px;
  cursor: pointer; transition: background 0.2s;
}
#controls button:hover { background: rgba(170,136,255,0.3); }
#controls label { color: #c0c8d8; display: flex; align-items: center; gap: 8px; }
#controls input[type=range] { width: 100px; accent-color: #a8f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">
  <div class="title">SHIELD-PERCEPTRON</div>
  <div>Epoch: <span class="val" id="sEpoch">0</span></div>
  <div>W1: <span class="val" id="sW1">0.00</span></div>
  <div>W2: <span class="val" id="sW2">0.00</span></div>
  <div>Bias: <span class="val" id="sBias">0.00</span></div>
  <div>Points: <span class="val" id="sPoints">0</span></div>
  <div>Accuracy: <span class="val" id="sAcc">-</span></div>
  <div>LR: <span class="val" id="sLR">0.01</span></div>
</div>
<div id="controls">
  <div style="color:#a8f;font-weight:bold;margin-bottom:4px;">Controls</div>
  <div style="color:#888;font-size:11px;">Left-click: +1 (positive)<br>Right-click: -1 (negative)</div>
  <label>Learning Rate <input type="range" id="lrSlider" min="1" max="100" value="10"></label>
  <button id="btnTrain">Train Step (x50)</button>
  <button id="btnAutoTrain">Auto Train: OFF</button>
  <button id="btnReset">Reset</button>
  <button id="btnDemo">Add Demo Data</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

// Perceptron state
let w1 = (Math.random() - 0.5) * 2;
let w2 = (Math.random() - 0.5) * 2;
let bias = (Math.random() - 0.5) * 2;
let lr = 0.01;
let epoch = 0;
let autoTrain = false;
let points = []; // {x, y, label: +1 or -1}
let accuracy = '-';

// Coordinate mapping: data space [-1,1] x [-1,1] mapped to canvas
const margin = 80;
function plotArea() {
  const size = Math.min(W - 260, H - 100);
  const s = Math.max(300, size);
  const cx = (W - 200) / 2;
  const cy = H / 2;
  return { x: cx - s/2, y: cy - s/2, w: s, h: s };
}
function dataToCanvas(dx, dy) {
  const a = plotArea();
  return { x: a.x + (dx + 1) / 2 * a.w, y: a.y + (1 - (dy + 1) / 2) * a.h };
}
function canvasToData(cx, cy) {
  const a = plotArea();
  return { x: (cx - a.x) / a.w * 2 - 1, y: 1 - (cy - a.y) / a.h * 2 };
}

// Perceptron forward
function predict(x, y) { return w1 * x + w2 * y + bias; }
function classify(x, y) { return predict(x, y) >= 0 ? 1 : -1; }

// Training
function trainStep() {
  if (points.length === 0) return;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const pred = classify(p.x, p.y);
    if (pred !== p.label) {
      w1 += lr * p.label * p.x;
      w2 += lr * p.label * p.y;
      bias += lr * p.label;
    }
  }
  epoch++;
  // Accuracy
  let correct = 0;
  for (const p of points) if (classify(p.x, p.y) === p.label) correct++;
  accuracy = (correct / points.length * 100).toFixed(1) + '%';
}

// Mouse
canvas.addEventListener('click', (e) => {
  const d = canvasToData(e.clientX, e.clientY);
  if (d.x >= -1 && d.x <= 1 && d.y >= -1 && d.y <= 1) {
    points.push({ x: d.x, y: d.y, label: 1 });
  }
});
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const d = canvasToData(e.clientX, e.clientY);
  if (d.x >= -1 && d.x <= 1 && d.y >= -1 && d.y <= 1) {
    points.push({ x: d.x, y: d.y, label: -1 });
  }
});

// Controls
document.getElementById('lrSlider').addEventListener('input', (e) => {
  lr = e.target.value / 1000;
  document.getElementById('sLR').textContent = lr.toFixed(4);
});
document.getElementById('btnTrain').addEventListener('click', () => {
  for (let i = 0; i < 50; i++) trainStep();
});
document.getElementById('btnAutoTrain').addEventListener('click', function() {
  autoTrain = !autoTrain;
  this.textContent = 'Auto Train: ' + (autoTrain ? 'ON' : 'OFF');
});
document.getElementById('btnReset').addEventListener('click', () => {
  points = []; w1 = (Math.random()-0.5)*2; w2 = (Math.random()-0.5)*2;
  bias = (Math.random()-0.5)*2; epoch = 0; accuracy = '-';
});
document.getElementById('btnDemo').addEventListener('click', () => {
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * 2 - 1, y = Math.random() * 2 - 1;
    points.push({ x, y, label: (x + y > 0.2) ? 1 : -1 });
  }
});

// Particles for ambiance
const particles = [];
for (let i = 0; i < 40; i++) {
  particles.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*1.5+0.5 });
}

let time = 0;
function draw() {
  requestAnimationFrame(draw);
  time++;
  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, W, H);

  // Particles
  ctx.globalAlpha = 0.15;
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.fillStyle = '#a8f';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const area = plotArea();

  // Decision boundary background coloring
  const step = 8;
  for (let px = area.x; px < area.x + area.w; px += step) {
    for (let py = area.y; py < area.y + area.h; py += step) {
      const d = canvasToData(px + step/2, py + step/2);
      const val = predict(d.x, d.y);
      const intensity = Math.min(Math.abs(val) * 0.3, 0.25);
      ctx.fillStyle = val >= 0 ? `rgba(100,200,255,${intensity})` : `rgba(255,100,150,${intensity})`;
      ctx.fillRect(px, py, step, step);
    }
  }

  // Grid
  ctx.strokeStyle = 'rgba(170,136,255,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const fx = area.x + i / 10 * area.w;
    const fy = area.y + i / 10 * area.h;
    ctx.beginPath(); ctx.moveTo(fx, area.y); ctx.lineTo(fx, area.y + area.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(area.x, fy); ctx.lineTo(area.x + area.w, fy); ctx.stroke();
  }

  // Border
  ctx.strokeStyle = '#a8f';
  ctx.lineWidth = 2;
  ctx.strokeRect(area.x, area.y, area.w, area.h);

  // Decision boundary line
  if (Math.abs(w2) > 1e-8 || Math.abs(w1) > 1e-8) {
    ctx.strokeStyle = '#a8f';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#a8f';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    // Find two points on boundary: w1*x + w2*y + bias = 0 => y = -(w1*x + bias)/w2
    let pts = [];
    if (Math.abs(w2) > 1e-8) {
      for (const xv of [-1, 1]) {
        const yv = -(w1 * xv + bias) / w2;
        if (yv >= -1.1 && yv <= 1.1) pts.push({x: xv, y: yv});
      }
    }
    if (Math.abs(w1) > 1e-8) {
      for (const yv of [-1, 1]) {
        const xv = -(w2 * yv + bias) / w1;
        if (xv >= -1.1 && xv <= 1.1) pts.push({x: xv, y: yv});
      }
    }
    if (pts.length >= 2) {
      const c1 = dataToCanvas(pts[0].x, pts[0].y);
      const c2 = dataToCanvas(pts[1].x, pts[1].y);
      ctx.moveTo(c1.x, c1.y);
      ctx.lineTo(c2.x, c2.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // Data points
  for (const p of points) {
    const c = dataToCanvas(p.x, p.y);
    ctx.beginPath();
    if (p.label === 1) {
      ctx.fillStyle = 'rgba(100,200,255,0.9)';
      ctx.strokeStyle = '#6cf';
      ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = '#f88';
      ctx.fillStyle = 'rgba(255,100,100,0.9)';
      ctx.lineWidth = 2;
      ctx.moveTo(c.x - 5, c.y - 5); ctx.lineTo(c.x + 5, c.y + 5);
      ctx.moveTo(c.x + 5, c.y - 5); ctx.lineTo(c.x - 5, c.y + 5);
      ctx.stroke();
    }
  }

  // Weight vector arrow
  const mag = Math.sqrt(w1*w1 + w2*w2);
  if (mag > 0.01) {
    const cx0 = dataToCanvas(0, 0);
    const arrowLen = 60;
    const ax = w1 / mag * arrowLen;
    const ay = -w2 / mag * arrowLen;
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx0.x, cx0.y);
    ctx.lineTo(cx0.x + ax, cx0.y + ay);
    ctx.stroke();
    // Arrowhead
    const angle = Math.atan2(ay, ax);
    ctx.beginPath();
    ctx.moveTo(cx0.x + ax, cx0.y + ay);
    ctx.lineTo(cx0.x + ax - 8*Math.cos(angle-0.4), cx0.y + ay - 8*Math.sin(angle-0.4));
    ctx.moveTo(cx0.x + ax, cx0.y + ay);
    ctx.lineTo(cx0.x + ax - 8*Math.cos(angle+0.4), cx0.y + ay - 8*Math.sin(angle+0.4));
    ctx.stroke();
  }

  // Title on canvas
  ctx.fillStyle = '#a8f';
  ctx.font = 'bold 18px Courier New';
  ctx.fillText('SHIELD-PERCEPTRON', area.x, area.y - 16);
  ctx.font = '12px Courier New';
  ctx.fillStyle = '#888';
  ctx.fillText('Single Perceptron — Linear Decision Boundary', area.x, area.y - 2);

  // Auto-train
  if (autoTrain && points.length > 0) {
    for (let i = 0; i < 5; i++) trainStep();
  }

  // Update stats
  document.getElementById('sEpoch').textContent = epoch;
  document.getElementById('sW1').textContent = w1.toFixed(4);
  document.getElementById('sW2').textContent = w2.toFixed(4);
  document.getElementById('sBias').textContent = bias.toFixed(4);
  document.getElementById('sPoints').textContent = points.length;
  document.getElementById('sAcc').textContent = accuracy;
}
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIELD-NUMBER — 7-PILLAR FACTORIZATION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060610;color:#ccc;font-family:'Courier New',monospace;overflow-x:hidden;min-height:100vh}
canvas{display:block;margin:0 auto}
#shield-nav{position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(6,6,16,.92);border-bottom:1px solid rgba(0,170,255,.15);font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;backdrop-filter:blur(8px)}
#shield-nav a{text-decoration:none}
#main-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#overlay{position:fixed;top:34px;left:0;right:0;bottom:0;z-index:1;pointer-events:none}
#overlay *{pointer-events:auto}
#number-display{text-align:center;padding:18px 10px 6px;font-size:11px;color:#0ad;letter-spacing:1px;text-shadow:0 0 12px rgba(0,170,221,.5)}
#number-display .big{font-size:clamp(10px,2vw,18px);color:#fc0;letter-spacing:2px;word-break:break-all;text-shadow:0 0 20px rgba(255,204,0,.4),0 0 40px rgba(255,204,0,.15);line-height:1.5}
#number-display .label{font-size:10px;color:#068;margin-bottom:4px}
#factorization{text-align:center;font-size:clamp(10px,1.5vw,14px);color:#0ad;padding:4px 10px;letter-spacing:1px}
#factorization sup{color:#fc0;font-size:0.7em}
#cascade-display{text-align:center;font-size:11px;color:#0a8;padding:4px 10px;min-height:22px;opacity:0.9}
#binary-strip{text-align:center;padding:6px 10px;overflow:hidden}
#binary-strip canvas{display:block;margin:0 auto;image-rendering:pixelated}
#pillar-area{position:relative;width:100%;display:flex;justify-content:center;padding:8px 0}
#pillar-canvas{display:block;margin:0 auto;cursor:pointer}
#pillar-info{position:fixed;background:rgba(6,6,16,.95);border:1px solid #0ad;border-radius:6px;padding:10px 14px;font-size:11px;color:#0ad;z-index:100;pointer-events:none;display:none;text-shadow:0 0 6px rgba(0,170,221,.3);max-width:280px}
#metrics-bar{position:fixed;bottom:26px;left:0;right:0;height:30px;background:rgba(6,6,16,.92);border-top:1px solid rgba(0,170,255,.15);z-index:10;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,32px);font-size:10px}
.metric .lbl{color:#068;font-size:8px;display:block;text-align:center}
.metric .val{color:#0ad;font-weight:bold;text-align:center;display:block}
.metric .val.gold{color:#fc0}
#footer{position:fixed;bottom:0;left:0;right:0;height:26px;background:rgba(6,6,16,.95);border-top:1px solid rgba(0,170,255,.08);z-index:10;display:flex;align-items:center;justify-content:center;font-size:9px;color:#445;letter-spacing:2px}
#footer span{color:#0ad}
</style>
</head>
<body>

<nav id="shield-nav">
<a href="../" style="color:#0af;margin-right:4px" title="Gallery">&#9664; GALLERY</a>
<span style="color:#334">|</span>
<a href="../orb/" style="color:#604">ORB</a>
<a href="../cascade/" style="color:#fa0">CASCADE</a>
<a href="../breath/" style="color:#a4f">BREATH</a>
<a href="../flat/" style="color:#0f8">FLAT</a>
<a href="../tree/" style="color:#4a4">TREE</a>
<a href="../drug/" style="color:#f44">DRUG</a>
<a href="../network/" style="color:#fc0">NETWORK</a>
<a href="../number/" style="color:#fff;text-shadow:0 0 6px rgba(255,255,255,.5)">NUMBER</a>
<a href="../spiral/" style="color:#0ad">SPIRAL</a>
<a href="../sieve/" style="color:#f80">SIEVE</a>
<a href="../twin/" style="color:#88f">TWIN</a>
<a href="../perfect/" style="color:#4f4">PERFECT</a>
</nav>

<canvas id="main-canvas"></canvas>

<div id="overlay">
  <div id="number-display">
    <div class="label">SHIELD-NUMBER &middot; 7-PILLAR FACTORIZATION</div>
    <div class="big" id="the-number"></div>
  </div>
  <div id="factorization">
    2<sup>2</sup> &times; 3<sup>8</sup> &times; 5<sup>3</sup> &times; 7<sup>7</sup> &times; 11<sup>15</sup> &times; 13<sup>6</sup> &times; 17<sup>12</sup>
  </div>
  <div id="cascade-display" id="cascade-text"></div>
  <div id="binary-strip"><canvas id="binary-canvas" height="18"></canvas></div>
  <div id="pillar-area"><canvas id="pillar-canvas"></canvas></div>
</div>

<div id="pillar-info"></div>

<div id="metrics-bar">
  <div class="metric"><span class="lbl">PRIMES</span><span class="val">7</span></div>
  <div class="metric"><span class="lbl">EXPONENTS SUM</span><span class="val gold">53</span></div>
  <div class="metric"><span class="lbl">PRODUCT</span><span class="val gold">9! = 362,880</span></div>
  <div class="metric"><span class="lbl">DIVISORS</span><span class="val">1,257,984</span></div>
  <div class="metric"><span class="lbl">BITS</span><span class="val">165</span></div>
</div>

<div id="footer">
  <span>510,510</span>&nbsp;= 2&times;3&times;5&times;7&times;11&times;13&times;17 &middot; LIGHT TO LIGHT
</div>

<script>
// === DATA ===
const NUM_STR = "31736846399216804645406807161448227806067941438500";
const NUM_DIGITS = NUM_STR.split('').map(Number);
const PRIMES = [2, 3, 5, 7, 11, 13, 17];
const EXPONENTS = [2, 8, 3, 7, 15, 6, 12];
const COLORS = ['#604','#0ad','#fa0','#f44','#4a4','#a4f','#fff'];
const COLOR_RGB = [
  [102,0,68],[0,170,221],[255,170,0],[255,68,68],[68,170,68],[170,68,255],[255,255,255]
];
const MAX_EXP = 15;
const BINARY_165 = (() => {
  // Compute binary from the number string via BigInt
  let n = BigInt("31736846399216804645406807161448227806067941438500");
  let bits = n.toString(2);
  while(bits.length < 165) bits = '0' + bits;
  return bits;
})();

// Prime power values as strings (precomputed)
const PRIME_POWERS = [
  "4",           // 2^2
  "6561",        // 3^8
  "125",         // 5^3
  "823543",      // 7^7
  "4177248169415651", // 11^15
  "4826809",     // 13^6
  "582622237229761"   // 17^12
];

// === MAIN CANVAS (background particles) ===
const bgCanvas = document.getElementById('main-canvas');
const bgCtx = bgCanvas.getContext('2d');

function resizeBg(){
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

// Background ambient particles
const bgParticles = [];
for(let i=0;i<80;i++){
  bgParticles.push({
    x: Math.random()*2000, y: Math.random()*2000,
    vx: (Math.random()-0.5)*0.15, vy: -Math.random()*0.3-0.05,
    r: Math.random()*1.5+0.5,
    c: COLORS[Math.floor(Math.random()*7)],
    a: Math.random()*0.3+0.05
  });
}

function drawBg(t){
  const W=bgCanvas.width, H=bgCanvas.height;
  bgCtx.fillStyle='#060610';
  bgCtx.fillRect(0,0,W,H);

  // Subtle radial glow
  const grd = bgCtx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,H*0.6);
  grd.addColorStop(0,'rgba(0,40,80,0.06)');
  grd.addColorStop(1,'rgba(6,6,16,0)');
  bgCtx.fillStyle=grd;
  bgCtx.fillRect(0,0,W,H);

  for(const p of bgParticles){
    p.x += p.vx;
    p.y += p.vy;
    if(p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
    if(p.x < -10) p.x = W+10;
    if(p.x > W+10) p.x = -10;
    bgCtx.globalAlpha = p.a * (0.5 + 0.5*Math.sin(t*0.001 + p.x));
    bgCtx.fillStyle = p.c;
    bgCtx.beginPath();
    bgCtx.arc(p.x%W, p.y, p.r, 0, Math.PI*2);
    bgCtx.fill();
  }
  bgCtx.globalAlpha=1;
}

// === NUMBER DISPLAY ANIMATION ===
const numEl = document.getElementById('the-number');
let numGlowPhases = NUM_DIGITS.map((_,i) => Math.random()*Math.PI*2);
function animateNumber(t){
  let html = '';
  for(let i=0;i<NUM_STR.length;i++){
    const glow = 0.5 + 0.5*Math.sin(t*0.003 + numGlowPhases[i]);
    const alpha = 0.6 + 0.4*glow;
    const shadow = Math.floor(glow*20);
    // Every 3 digits, add thin space for readability
    if(i > 0 && (NUM_STR.length - i) % 3 === 0){
      html += '<span style="display:inline-block;width:3px"></span>';
    }
    html += `<span style="opacity:${alpha.toFixed(2)};text-shadow:0 0 ${shadow}px rgba(255,204,0,${(glow*0.6).toFixed(2)})">${NUM_STR[i]}</span>`;
  }
  numEl.innerHTML = html;
}

// === BINARY STRIP ===
const binCanvas = document.getElementById('binary-canvas');
const binCtx = binCanvas.getContext('2d');
function drawBinary(t){
  const cellW = Math.max(3, Math.min(6, Math.floor((window.innerWidth - 40) / 165)));
  binCanvas.width = 165 * cellW;
  binCanvas.height = 18;
  binCtx.clearRect(0,0,binCanvas.width,18);
  for(let i=0;i<165;i++){
    const bit = BINARY_165[i] === '1';
    const pulse = 0.5 + 0.5*Math.sin(t*0.002 + i*0.12);
    if(bit){
      const r = 0 + 170*pulse*0.3;
      const g = 140 + 80*pulse;
      const b = 200 + 55*pulse;
      binCtx.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
      binCtx.shadowColor = `rgba(0,200,255,${(pulse*0.6).toFixed(2)})`;
      binCtx.shadowBlur = 4;
    } else {
      binCtx.fillStyle = `rgba(30,30,50,${(0.3+0.15*pulse).toFixed(2)})`;
      binCtx.shadowColor = 'transparent';
      binCtx.shadowBlur = 0;
    }
    binCtx.fillRect(i*cellW, 2, cellW-1, 14);
  }
  binCtx.shadowBlur = 0;
}

// === PILLAR VISUALIZATION ===
const pillarCanvas = document.getElementById('pillar-canvas');
const pCtx = pillarCanvas.getContext('2d');
const pillarInfo = document.getElementById('pillar-info');

// Pillar particles
const pillarParticles = [];
for(let pi=0;pi<7;pi++){
  const count = EXPONENTS[pi] * 2;
  for(let j=0;j<count;j++){
    pillarParticles.push({
      pi, x:0, y:0,
      offX: (Math.random()-0.5)*20,
      speed: Math.random()*0.6+0.2,
      phase: Math.random()*Math.PI*2,
      size: Math.random()*2+0.8,
      life: Math.random()
    });
  }
}

let selectedPillar = -1;
let pillarRects = [];

function getPillarDimensions(){
  const W = Math.min(window.innerWidth - 20, 700);
  const gap = 12;
  const pillarW = Math.floor((W - gap*8) / 7);
  const maxH = Math.min(260, window.innerHeight * 0.28);
  return {W, gap, pillarW, maxH};
}

function drawPillars(t){
  const {W, gap, pillarW, maxH} = getPillarDimensions();
  const H = maxH + 60;
  pillarCanvas.width = W;
  pillarCanvas.height = H;
  pCtx.clearRect(0,0,W,H);
  pillarRects = [];

  const baseY = H - 30;

  for(let i=0;i<7;i++){
    const x = gap + i*(pillarW + gap);
    const pillarH = (EXPONENTS[i]/MAX_EXP) * maxH;
    const y = baseY - pillarH;
    const isSelected = selectedPillar === i;
    const pulse = 0.5 + 0.5*Math.sin(t*0.003 + i*0.8);

    pillarRects.push({x, y, w:pillarW, h:pillarH, baseY});

    // Glow behind pillar
    const glowAlpha = isSelected ? 0.25 : 0.08 + 0.04*pulse;
    const grd = pCtx.createRadialGradient(x+pillarW/2, baseY, 0, x+pillarW/2, baseY, pillarH*0.8);
    grd.addColorStop(0, COLORS[i] + Math.floor(glowAlpha*255).toString(16).padStart(2,'0'));
    grd.addColorStop(1, 'transparent');
    pCtx.fillStyle = grd;
    pCtx.fillRect(x-pillarW*0.5, y-20, pillarW*2, pillarH+40);

    // Pillar body
    const bodyGrd = pCtx.createLinearGradient(x,y,x,baseY);
    const [cr,cg,cb] = COLOR_RGB[i];
    bodyGrd.addColorStop(0, `rgba(${cr},${cg},${cb},${isSelected?1:0.85})`);
    bodyGrd.addColorStop(1, `rgba(${cr},${cg},${cb},${isSelected?0.7:0.4})`);
    pCtx.fillStyle = bodyGrd;

    // Rounded top
    const radius = Math.min(6, pillarW/3);
    pCtx.beginPath();
    pCtx.moveTo(x, baseY);
    pCtx.lineTo(x, y+radius);
    pCtx.arcTo(x, y, x+radius, y, radius);
    pCtx.lineTo(x+pillarW-radius, y);
    pCtx.arcTo(x+pillarW, y, x+pillarW, y+radius, radius);
    pCtx.lineTo(x+pillarW, baseY);
    pCtx.closePath();
    pCtx.fill();

    // Inner glow lines
    pCtx.strokeStyle = `rgba(${cr},${cg},${cb},${0.15+0.15*pulse})`;
    pCtx.lineWidth = 1;
    const lines = Math.min(EXPONENTS[i], 15);
    for(let l=0;l<lines;l++){
      const ly = y + (pillarH/(lines+1))*(l+1);
      pCtx.beginPath();
      pCtx.moveTo(x+2, ly);
      pCtx.lineTo(x+pillarW-2, ly);
      pCtx.stroke();
    }

    // Border
    if(isSelected){
      pCtx.strokeStyle = COLORS[i];
      pCtx.lineWidth = 2;
      pCtx.shadowColor = COLORS[i];
      pCtx.shadowBlur = 12;
      pCtx.beginPath();
      pCtx.moveTo(x, baseY);
      pCtx.lineTo(x, y+radius);
      pCtx.arcTo(x, y, x+radius, y, radius);
      pCtx.lineTo(x+pillarW-radius, y);
      pCtx.arcTo(x+pillarW, y, x+pillarW, y+radius, radius);
      pCtx.lineTo(x+pillarW, baseY);
      pCtx.stroke();
      pCtx.shadowBlur = 0;
    }

    // Prime label at bottom
    pCtx.fillStyle = COLORS[i];
    pCtx.font = 'bold 11px Courier New';
    pCtx.textAlign = 'center';
    pCtx.fillText(PRIMES[i].toString(), x+pillarW/2, baseY+14);

    // Exponent at top
    pCtx.fillStyle = '#fff';
    pCtx.font = '10px Courier New';
    pCtx.fillText('^'+EXPONENTS[i], x+pillarW/2, y-6);
  }

  // Particles
  for(const p of pillarParticles){
    const rect = pillarRects[p.pi];
    if(!rect) continue;
    const cx = rect.x + rect.w/2 + p.offX;
    p.life -= 0.003 * p.speed;
    if(p.life <= 0) p.life = 1;
    const py = rect.baseY - p.life * (rect.h + 40);
    const alpha = p.life > 0.8 ? (1-p.life)*5 : p.life > 0.2 ? 1 : p.life*5;
    const [cr,cg,cb] = COLOR_RGB[p.pi];
    pCtx.globalAlpha = alpha * 0.5 * (selectedPillar===p.pi ? 1.5 : 0.7);
    pCtx.fillStyle = COLORS[p.pi];
    pCtx.beginPath();
    pCtx.arc(cx + Math.sin(t*0.002+p.phase)*5, py, p.size, 0, Math.PI*2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;

  // Base line
  pCtx.strokeStyle = 'rgba(0,170,221,0.2)';
  pCtx.lineWidth = 1;
  pCtx.beginPath();
  pCtx.moveTo(0, pillarRects[0].baseY + 0.5);
  pCtx.lineTo(W, pillarRects[0].baseY + 0.5);
  pCtx.stroke();
}

// Click on pillar
pillarCanvas.addEventListener('click', (e) => {
  const rect = pillarCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (pillarCanvas.width / rect.width);
  const my = (e.clientY - rect.top) * (pillarCanvas.height / rect.height);
  let clicked = -1;
  for(let i=0;i<7;i++){
    const r = pillarRects[i];
    if(r && mx >= r.x && mx <= r.x+r.w && my >= r.y && my <= r.baseY){
      clicked = i;
      break;
    }
  }
  if(clicked === selectedPillar) selectedPillar = -1;
  else selectedPillar = clicked;
  updatePillarInfo(e);
});

pillarCanvas.addEventListener('mousemove', (e) => {
  const rect = pillarCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (pillarCanvas.width / rect.width);
  const my = (e.clientY - rect.top) * (pillarCanvas.height / rect.height);
  let hovered = false;
  for(let i=0;i<7;i++){
    const r = pillarRects[i];
    if(r && mx >= r.x && mx <= r.x+r.w && my >= r.y && my <= r.baseY){
      hovered = true;
      break;
    }
  }
  pillarCanvas.style.cursor = hovered ? 'pointer' : 'default';
});

function updatePillarInfo(e){
  if(selectedPillar < 0){
    pillarInfo.style.display = 'none';
    return;
  }
  const i = selectedPillar;
  pillarInfo.innerHTML = `
    <div style="color:${COLORS[i]};font-weight:bold;font-size:13px;margin-bottom:4px">
      Ring ${i} &mdash; p = ${PRIMES[i]}
    </div>
    <div style="color:#aaa;font-size:10px">
      ${PRIMES[i]}<sup style="color:${COLORS[i]}">${EXPONENTS[i]}</sup> = ${Number(BigInt(PRIME_POWERS[i])).toLocaleString ? PRIME_POWERS[i] : PRIME_POWERS[i]}
    </div>
    <div style="color:#068;font-size:9px;margin-top:4px">
      Exponent: ${EXPONENTS[i]} &middot; Contributes to ${EXPONENTS[i]+1} divisor choices
    </div>
  `;
  pillarInfo.style.display = 'block';
  // Position near the pillar
  const cr = pillarCanvas.getBoundingClientRect();
  const r = pillarRects[i];
  const scale = cr.width / pillarCanvas.width;
  let px = cr.left + (r.x + r.w/2) * scale;
  let py = cr.top + r.y * scale - 10;
  // Keep on screen
  const pw = 260;
  if(px + pw/2 > window.innerWidth - 10) px = window.innerWidth - pw - 10;
  if(px - pw/2 < 10) px = 10;
  else px -= pw/2;
  if(py < 40) py = cr.top + r.baseY * scale + 10;
  pillarInfo.style.left = px + 'px';
  pillarInfo.style.top = (py - 70) + 'px';
}

// === FACTORIZATION CASCADE ===
const cascadeEl = document.getElementById('cascade-display');
let cascadeState = {
  phase: 'idle',  // idle, running, done
  primeIdx: 0,
  expIdx: 0,
  current: BigInt(NUM_STR),
  timer: 0,
  waitTimer: 0,
  doneTimer: 0
};

function formatBigNum(n){
  let s = n.toString();
  // Add commas
  let result = '';
  for(let i=0;i<s.length;i++){
    if(i>0 && (s.length-i)%3===0) result += ',';
    result += s[i];
  }
  return result;
}

function updateCascade(t){
  const cs = cascadeState;
  cs.timer++;

  if(cs.phase === 'idle'){
    cs.waitTimer++;
    if(cs.waitTimer > 180){ // ~3 seconds
      cs.phase = 'running';
      cs.primeIdx = 0;
      cs.expIdx = 0;
      cs.current = BigInt(NUM_STR);
      cs.timer = 0;
    }
    if(cs.waitTimer < 180){
      const dots = '.'.repeat(Math.floor(t/500)%4);
      cascadeEl.innerHTML = `<span style="color:#445">FACTORIZATION CASCADE${dots}</span>`;
    }
    return;
  }

  if(cs.phase === 'running'){
    if(cs.timer % 4 === 0){ // speed: every 4 frames
      const p = BigInt(PRIMES[cs.primeIdx]);
      cs.current = cs.current / p;
      cs.expIdx++;

      const color = COLORS[cs.primeIdx];
      const numStr = formatBigNum(cs.current);
      const shortened = numStr.length > 40 ? numStr.substring(0,18) + '...' + numStr.substring(numStr.length-18) : numStr;
      cascadeEl.innerHTML = `<span style="color:${color}">&div; ${PRIMES[cs.primeIdx]}</span> <span style="color:#068">[${cs.expIdx}/${EXPONENTS[cs.primeIdx]}]</span> <span style="color:#0a8">= ${shortened}</span>`;

      if(cs.expIdx >= EXPONENTS[cs.primeIdx]){
        cs.primeIdx++;
        cs.expIdx = 0;
        if(cs.primeIdx >= 7){
          cs.phase = 'done';
          cs.doneTimer = 0;
          cascadeEl.innerHTML = `<span style="color:#fc0">CASCADE COMPLETE &rarr; 1</span>`;
        }
      }
    }
    return;
  }

  if(cs.phase === 'done'){
    cs.doneTimer++;
    if(cs.doneTimer > 300){ // wait ~5s then restart
      cs.phase = 'idle';
      cs.waitTimer = 0;
    }
  }
}

// === MAIN LOOP ===
let startTime = performance.now();
function frame(now){
  const t = now - startTime;
  drawBg(t);
  animateNumber(t);
  drawBinary(t);
  drawPillars(t);
  updateCascade(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Handle window resize for pillar info repositioning
window.addEventListener('resize', () => {
  if(selectedPillar >= 0){
    pillarInfo.style.display = 'none';
    selectedPillar = -1;
  }
});

// Close pillar info on click outside
document.addEventListener('click', (e) => {
  if(!pillarCanvas.contains(e.target) && !pillarInfo.contains(e.target)){
    selectedPillar = -1;
    pillarInfo.style.display = 'none';
  }
});
</script>
</body>
</html>

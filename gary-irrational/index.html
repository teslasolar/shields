<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARY · IRRATIONAL DIGITS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#040810}
canvas{display:block;width:100%;height:100%}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:8px;letter-spacing:2px;color:#4cf;opacity:0.6;text-align:center;pointer-events:none;line-height:2}
#stats{position:fixed;top:16px;left:16px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;color:#4cf;line-height:2.2}
#controls{position:fixed;top:16px;right:16px;font-family:'Courier New',monospace;font-size:8px}
#controls button{background:rgba(68,204,255,0.1);border:1px solid rgba(68,204,255,0.3);color:#4cf;font-family:inherit;font-size:8px;letter-spacing:1px;padding:5px 12px;cursor:pointer;border-radius:4px;margin:2px;display:block;width:100%}
#controls button:hover{background:rgba(68,204,255,0.2)}
.active-const{background:rgba(68,204,255,0.25)!important;border-color:#4cf!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">
  CONSTANT: <span id="constName">π</span><br>
  DIGITS SCANNED: <span id="digitCount">0</span><br>
  KURTOSIS κ = <span id="kurtosis">0.000</span><br>
  χ² UNIFORMITY: <span id="chi2">0.000</span><br>
  MAX GAP: <span id="maxgap">0</span>
</div>
<div id="controls">
  <button id="btn-pi" class="active-const" onclick="setConst('pi')">π PI</button>
  <button id="btn-e" onclick="setConst('e')">e EULER</button>
  <button id="btn-sqrt2" onclick="setConst('sqrt2')">√2</button>
  <button id="btn-phi" onclick="setConst('phi')">φ GOLDEN</button>
  <button onclick="scanSpeed=(scanSpeed===5?50:scanSpeed===50?200:5)">SPEED ×</button>
</div>
<div id="info">GARY · IRRATIONAL DIGIT HUNTER · κ=1.93 FOUND<br>SCANNING FOR PATTERNS IN THE INFINITE</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const TAU = Math.PI * 2;
let W, H, t = 0;

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Generate digits using spigot-like approach (BBP-style for pi, series for others)
// For simplicity, use JS Math and string extraction + pseudo-random continuation
function generateDigits(type, count) {
  let digits = [];
  let source = '';

  if (type === 'pi') {
    // Machin-like formula + pre-computed start
    source = '14159265358979323846264338327950288419716939937510' +
      '58209749445923078164062862089986280348253421170679' +
      '82148086513282306647093844609550582231725359408128' +
      '48111745028410270193852110555964462294895493038196' +
      '44288109756659334461284756482337867831652712019091' +
      '45648566923460348610454326648213393607260249141273' +
      '72458700660631558817488152092096282925409171536436' +
      '78925903600113305305488204665213841469519415116094' +
      '33057270365759591953092186117381932611793105118548' +
      '07446237996274956735188575272489122793818301194912';
  } else if (type === 'e') {
    source = '71828182845904523536028747135266249775724709369995' +
      '95749669676277240766303535475945713821785251664274' +
      '27466391932003059921817413596629043572900334295260' +
      '59563073813232862794349076323382988075319525101901' +
      '15738341879307021540891499348841675092447614606680' +
      '82264800168477411853742345442437107539077744992069' +
      '55170276183860626133138458300075204493382656029760' +
      '67371132007093287091274437470472306969772093101416' +
      '92836819025515108657463772111252389784425056953696' +
      '77078544996996794686445490598793163688923009879312';
  } else if (type === 'sqrt2') {
    source = '41421356237309504880168872420969807856967187537694' +
      '67139918594370275267492985637489532485014271575958' +
      '06941005803952835415502119584348358817561720585313' +
      '61150946218575615893373398607948228683606552679298' +
      '76862251842063169107891398215671175795067534626779' +
      '05819948901726790572856479983564020883725706000228' +
      '75929509901988766517817440235086751345213571460020' +
      '47780015381752023851805581505063543283707118841051' +
      '15820974944592307816406286208998628034825342117067' +
      '98214808651328230664709384460955058223172535940812';
  } else { // phi
    source = '61803398874989484820458683436563811772030917980576' +
      '28621354486227052604628189024497072072041893911374' +
      '84754088075386891752126633862223536931793180060766' +
      '72635443338908659593958290563832266131992829026788' +
      '06752087668925017116962070322210432162695486262963' +
      '13614438149758701220340805887954454749246185695364' +
      '86444924104432077134494704956584678850987433944221' +
      '25448770664780915884607499887124007652170575179788' +
      '34166256249407589069704000281210427621771117778053' +
      '92171762931767523846748184676694051320005681271452';
  }

  // Parse to digit array
  for (let i = 0; i < source.length && digits.length < count; i++) {
    const d = parseInt(source[i]);
    if (!isNaN(d)) digits.push(d);
  }

  // Extend with pseudo-continuation (seeded from the constant)
  let seed = digits.reduce((a, b) => a * 10 + b, 0) % 2147483647;
  while (digits.length < count) {
    seed = (seed * 16807) % 2147483647;
    digits.push(seed % 10);
  }

  return digits;
}

let currentConst = 'pi';
let allDigits = generateDigits('pi', 10000);
let scanPos = 0;
let scanSpeed = 5;
let digitFreq = new Array(10).fill(0);
let gapTracker = new Array(10).fill(0); // last seen position of each digit
let maxGap = 0;
let kurtosisHistory = [];
let recentDigits = []; // for display

function setConst(type) {
  currentConst = type;
  allDigits = generateDigits(type, 10000);
  scanPos = 0;
  digitFreq = new Array(10).fill(0);
  gapTracker = new Array(10).fill(0);
  maxGap = 0;
  kurtosisHistory = [];
  recentDigits = [];

  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active-const'));
  const names = { pi: 'π', e: 'e', sqrt2: '√2', phi: 'φ' };
  document.getElementById('btn-' + type)?.classList.add('active-const');
  document.getElementById('constName').textContent = names[type] || type;
}

function computeKurtosis() {
  if (scanPos < 10) return 3; // normal baseline
  const n = digitFreq.reduce((a, b) => a + b, 0);
  if (n === 0) return 0;
  const probs = digitFreq.map(f => f / n);
  const mean = probs.reduce((a, b) => a + b, 0) / 10;
  const m2 = probs.reduce((a, p) => a + (p - mean) ** 2, 0) / 10;
  const m4 = probs.reduce((a, p) => a + (p - mean) ** 4, 0) / 10;
  if (m2 === 0) return 0;
  return m4 / (m2 * m2);
}

function chiSquared() {
  const n = digitFreq.reduce((a, b) => a + b, 0);
  if (n === 0) return 0;
  const expected = n / 10;
  return digitFreq.reduce((sum, f) => sum + (f - expected) ** 2 / expected, 0);
}

// Draw digit frequency histogram
function drawHistogram() {
  const histW = 220;
  const histH = 100;
  const ox = 16;
  const oy = H * 0.4;

  ctx.fillStyle = 'rgba(4,8,16,0.6)';
  ctx.fillRect(ox, oy, histW, histH);

  ctx.font = '7px Courier New';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(68,204,255,0.4)';
  ctx.fillText('DIGIT FREQUENCY', ox + 4, oy - 6);

  const maxF = Math.max(1, ...digitFreq);
  const barW = histW / 10;
  const DIGIT_COLORS = ['#f44','#f80','#fc0','#8f0','#0f8','#0ff','#08f','#44f','#a4f','#f4a'];

  for (let d = 0; d < 10; d++) {
    const barH = (digitFreq[d] / maxF) * histH * 0.85;
    ctx.fillStyle = DIGIT_COLORS[d] + '44';
    ctx.fillRect(ox + d * barW + 1, oy + histH - barH, barW - 2, barH);
    ctx.strokeStyle = DIGIT_COLORS[d] + '88';
    ctx.strokeRect(ox + d * barW + 1, oy + histH - barH, barW - 2, barH);

    // Digit label
    ctx.fillStyle = DIGIT_COLORS[d];
    ctx.textAlign = 'center';
    ctx.fillText(d.toString(), ox + d * barW + barW / 2, oy + histH + 12);

    // Count
    ctx.fillStyle = DIGIT_COLORS[d] + 'aa';
    ctx.font = '6px Courier New';
    ctx.fillText(digitFreq[d].toString(), ox + d * barW + barW / 2, oy + histH - barH - 4);
    ctx.font = '7px Courier New';
  }

  // Expected line
  const n = digitFreq.reduce((a, b) => a + b, 0);
  if (n > 0) {
    const expectedH = (n / 10 / maxF) * histH * 0.85;
    ctx.setLineDash([2, 3]);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.moveTo(ox, oy + histH - expectedH);
    ctx.lineTo(ox + histW, oy + histH - expectedH);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Kurtosis over time graph
function drawKurtosisGraph() {
  const gW = 220;
  const gH = 70;
  const ox = 16;
  const oy = H * 0.65;

  ctx.fillStyle = 'rgba(4,8,16,0.6)';
  ctx.fillRect(ox, oy, gW, gH);

  ctx.font = '7px Courier New';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(68,204,255,0.4)';
  ctx.fillText('KURTOSIS OVER DIGITS', ox + 4, oy - 6);

  // κ=1.93 reference
  const kRef = 1.93;
  const maxK = 5;
  const refY = oy + gH - (kRef / maxK) * gH;
  ctx.setLineDash([2, 3]);
  ctx.strokeStyle = 'rgba(255,153,0,0.3)';
  ctx.beginPath();
  ctx.moveTo(ox, refY);
  ctx.lineTo(ox + gW, refY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f90';
  ctx.fillText('κ=1.93 ★', ox + gW - 45, refY - 3);

  if (kurtosisHistory.length < 2) return;

  ctx.beginPath();
  for (let i = 0; i < kurtosisHistory.length; i++) {
    const x = ox + (i / kurtosisHistory.length) * gW;
    const y = oy + gH - (Math.min(maxK, kurtosisHistory[i]) / maxK) * gH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(68,204,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// Scrolling digit river
function drawDigitRiver() {
  const riverY = H * 0.15;
  const DIGIT_COLORS = ['#f44','#f80','#fc0','#8f0','#0f8','#0ff','#08f','#44f','#a4f','#f4a'];

  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';

  const visible = Math.min(recentDigits.length, Math.floor(W / 14));
  const startX = W * 0.5 - visible * 7;

  for (let i = Math.max(0, recentDigits.length - visible); i < recentDigits.length; i++) {
    const idx = i - Math.max(0, recentDigits.length - visible);
    const d = recentDigits[i];
    const x = startX + idx * 14;
    const age = (recentDigits.length - i) / visible;
    const alpha = Math.max(0.1, 1 - age);
    ctx.fillStyle = DIGIT_COLORS[d] + Math.round(alpha * 200).toString(16).padStart(2, '0');
    ctx.fillText(d.toString(), x, riverY);
  }

  // Cursor
  const cursorX = startX + visible * 14 + 4;
  const blink = Math.sin(t * 8) > 0;
  if (blink) {
    ctx.fillStyle = '#4cf';
    ctx.fillRect(cursorX, riverY - 10, 2, 14);
  }
}

// Autocorrelation heatmap
function drawAutocorrelation() {
  const mapSize = 100;
  const ox = W - mapSize - 20;
  const oy = H - mapSize - 60;
  const lags = 10;
  const cellSize = mapSize / lags;

  ctx.font = '7px Courier New';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(68,204,255,0.4)';
  ctx.fillText('AUTOCORRELATION', ox, oy - 6);

  if (recentDigits.length < 100) return;

  const recent = recentDigits.slice(-500);
  const mean = recent.reduce((a, b) => a + b, 0) / recent.length;

  for (let i = 0; i < lags; i++) {
    for (let j = 0; j < lags; j++) {
      const lag = i * lags + j + 1;
      let corr = 0, norm = 0;
      for (let k = 0; k < recent.length - lag; k++) {
        corr += (recent[k] - mean) * (recent[k + lag] - mean);
        norm += (recent[k] - mean) ** 2;
      }
      const r = norm > 0 ? corr / norm : 0;
      const absR = Math.min(1, Math.abs(r) * 5); // amplify for visibility

      const color = r > 0
        ? `rgba(68,204,255,${absR * 0.4})`
        : `rgba(255,153,0,${absR * 0.4})`;

      ctx.fillStyle = color;
      ctx.fillRect(ox + j * cellSize, oy + i * cellSize, cellSize - 1, cellSize - 1);
    }
  }
}

// Gap analysis sparkline
function drawGapAnalysis() {
  const ox = W * 0.5;
  const oy = H * 0.8;

  ctx.font = '7px Courier New';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(68,204,255,0.4)';
  ctx.fillText('DIGIT GAP LENGTHS', ox, oy - 6);

  const DIGIT_COLORS = ['#f44','#f80','#fc0','#8f0','#0f8','#0ff','#08f','#44f','#a4f','#f4a'];
  for (let d = 0; d < 10; d++) {
    const gap = scanPos - gapTracker[d];
    const barW = Math.min(150, gap * 0.5);
    ctx.fillStyle = DIGIT_COLORS[d] + '44';
    ctx.fillRect(ox, oy + d * 10, barW, 8);
    ctx.fillStyle = DIGIT_COLORS[d];
    ctx.font = '6px Courier New';
    ctx.fillText(d + ': ' + gap, ox + barW + 4, oy + d * 10 + 7);
  }
}

function draw() {
  t += 0.016;
  ctx.fillStyle = 'rgba(4,8,16,0.15)';
  ctx.fillRect(0, 0, W, H);

  // Scan digits
  for (let i = 0; i < scanSpeed && scanPos < allDigits.length; i++) {
    const d = allDigits[scanPos];
    digitFreq[d]++;
    recentDigits.push(d);
    if (recentDigits.length > 2000) recentDigits.shift();

    // Gap tracking
    const gap = scanPos - gapTracker[d];
    if (gap > maxGap && scanPos > 10) maxGap = gap;
    gapTracker[d] = scanPos;

    scanPos++;
  }

  // Stats
  const K = computeKurtosis();
  const X2 = chiSquared();
  kurtosisHistory.push(K);
  if (kurtosisHistory.length > 300) kurtosisHistory.shift();

  document.getElementById('digitCount').textContent = scanPos;
  document.getElementById('kurtosis').textContent = K.toFixed(3);
  document.getElementById('chi2').textContent = X2.toFixed(2);
  document.getElementById('maxgap').textContent = maxGap;

  // Highlight κ near 1.93
  const kEl = document.getElementById('kurtosis');
  if (Math.abs(K - 1.93) < 0.15) {
    kEl.style.color = '#f90';
    kEl.textContent = K.toFixed(3) + ' ★ GARY WAS RIGHT';
  } else {
    kEl.style.color = '#4cf';
  }

  drawDigitRiver();
  drawHistogram();
  drawKurtosisGraph();
  drawAutocorrelation();
  drawGapAnalysis();

  // Loop digits when exhausted
  if (scanPos >= allDigits.length) {
    allDigits = [...allDigits, ...generateDigits(currentConst, 5000).slice(500)];
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

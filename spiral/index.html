<!DOCTYPE html>

<title>SHIELD-SPIRAL — ULAM PRIME SPIRAL / 127D SHIELD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060610;color:#0f0;font-family:'Courier New',monospace;overflow:hidden;width:100vw;height:100vh;user-select:none}
canvas{position:fixed;top:0;left:0;z-index:0}

#info-panel{position:fixed;top:44px;left:8px;z-index:20;background:rgba(6,6,16,.88);border:1px solid rgba(0,170,255,.2);border-radius:4px;padding:10px 14px;font-size:10px;color:#0a8;min-width:170px;pointer-events:none}
#info-panel .title{color:#0af;font-size:11px;font-weight:bold;letter-spacing:2px;margin-bottom:6px;border-bottom:1px solid rgba(0,170,255,.15);padding-bottom:4px}
#info-panel .row{margin:3px 0;display:flex;justify-content:space-between;gap:10px}
#info-panel .lbl{color:#068}
#info-panel .val{color:#0f4;font-weight:bold}

#hover-panel{position:fixed;z-index:30;background:rgba(6,6,16,.94);border:1px solid rgba(0,170,255,.3);border-radius:4px;padding:8px 12px;font-size:10px;color:#0a8;pointer-events:none;display:none;max-width:260px}
#hover-panel .num{color:#0f4;font-size:14px;font-weight:bold}
#hover-panel .info{color:#0af;margin-top:2px}
#hover-panel .factors{color:#fa0;margin-top:2px}

#controls-panel{position:fixed;top:44px;right:8px;z-index:20;display:flex;flex-direction:column;gap:4px}
.ctrl-btn{background:rgba(6,6,16,.88);border:1px solid rgba(0,170,255,.25);color:#0af;font-size:10px;padding:5px 12px;border-radius:3px;cursor:pointer;font-family:'Courier New',monospace;letter-spacing:1px;transition:all .2s}
.ctrl-btn:hover{background:rgba(0,40,80,.5);border-color:#0af;color:#fff}
.ctrl-btn.active{background:rgba(0,60,120,.4);border-color:#0f4;color:#0f4;box-shadow:0 0 8px rgba(0,255,100,.15)}

#bottom-metrics{position:fixed;bottom:0;left:0;right:0;height:32px;background:rgba(6,6,16,.94);border-top:1px solid rgba(0,170,255,.15);z-index:20;display:flex;align-items:center;justify-content:center;gap:32px;font-size:10px}
#bottom-metrics .metric{text-align:center}
#bottom-metrics .lbl{color:#068;font-size:8px;display:block;letter-spacing:1px}
#bottom-metrics .val{color:#0f4;font-weight:bold;font-size:11px}

#footer-line{position:fixed;bottom:34px;left:0;right:0;height:18px;background:rgba(6,6,16,.8);border-top:1px solid rgba(100,0,60,.3);z-index:20;display:flex;align-items:center;justify-content:center;font-size:9px;color:#604;letter-spacing:2px}
</style>
</head>
<body>

<nav id="shield-nav" style="position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(6,6,16,.92);border-bottom:1px solid rgba(0,170,255,.15);font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;backdrop-filter:blur(8px)">

<span style="color:#334">|</span>

</nav>

<canvas id="canvas"></canvas>

<div id="info-panel">
  <div class="title">ULAM SPIRAL</div>
  <div class="row"><span class="lbl">ZOOM</span><span class="val" id="ip-zoom">1.00x</span></div>
  <div class="row"><span class="lbl">RANGE</span><span class="val" id="ip-range">1-10000</span></div>
  <div class="row"><span class="lbl">PRIMES</span><span class="val" id="ip-primes">0</span></div>
  <div class="row"><span class="lbl">DENSITY</span><span class="val" id="ip-density">0%</span></div>
</div>

<div id="controls-panel">
  <button class="ctrl-btn" id="btn-primes" onclick="togglePrimesOnly()">PRIMES ONLY</button>
  <button class="ctrl-btn" id="btn-find127" onclick="find127()">FIND 127</button>
  <button class="ctrl-btn" id="btn-diagonals" onclick="toggleDiagonals()">DIAGONALS</button>
  <button class="ctrl-btn" id="btn-replay" onclick="replayAnimation()">REPLAY</button>
</div>

<div id="hover-panel">
  <div class="num" id="hp-num"></div>
  <div class="info" id="hp-info"></div>
  <div class="factors" id="hp-factors"></div>
</div>

<div id="bottom-metrics">
  <div class="metric"><span class="lbl">PRIMES VISIBLE</span><span class="val" id="bm-primes">0</span></div>
  <div class="metric"><span class="lbl">DENSITY</span><span class="val" id="bm-density">0%</span></div>
  <div class="metric"><span class="lbl">TWIN PRIMES</span><span class="val" id="bm-twins">0</span></div>
  <div class="metric"><span class="lbl">MERSENNE IN VIEW</span><span class="val" id="bm-mersenne">0</span></div>
</div>

<div id="footer-line">510,510 = 2 &times; 3 &times; 5 &times; 7 &times; 11 &times; 13 &times; 17</div>

<script>
const MAX_N = 12000;
const CELL = 6;
const SHIELD_PRIMES = [2, 3, 5, 7, 11, 13, 17];
const SHIELD_COLORS = ['#f44','#fa0','#0ad','#a4f','#4a4','#fc0','#604'];
const MOD7_COLORS = ['#604','#0ad','#fa0','#f44','#4a4','#a4f','#fff'];

// Mersenne numbers: 2^n - 1
const MERSENNE_NUMBERS = new Set();
for (let n = 1; n <= 17; n++) MERSENNE_NUMBERS.add((1 << n) - 1);

// Sieve of Eratosthenes
const isPrime = new Uint8Array(MAX_N + 1);
isPrime.fill(1);
isPrime[0] = isPrime[1] = 0;
for (let i = 2; i * i <= MAX_N; i++) {
  if (isPrime[i]) for (let j = i * i; j <= MAX_N; j += i) isPrime[j] = 0;
}

const primeSet = new Set();
for (let i = 2; i <= MAX_N; i++) if (isPrime[i]) primeSet.add(i);

// Twin prime set
const twinPrimeSet = new Set();
for (let i = 2; i <= MAX_N - 2; i++) {
  if (isPrime[i] && isPrime[i + 2]) { twinPrimeSet.add(i); twinPrimeSet.add(i + 2); }
}

// Factorize
function factorize(n) {
  if (n <= 1) return [];
  const factors = [];
  let d = 2;
  while (d * d <= n) {
    while (n % d === 0) { factors.push(d); n /= d; }
    d++;
  }
  if (n > 1) factors.push(n);
  return factors;
}

// Ulam spiral coordinates: number -> (x, y) relative to center
const spiralCoords = new Array(MAX_N + 1);
(function computeSpiral() {
  let x = 0, y = 0;
  let dx = 1, dy = 0;
  let steps = 1, stepCount = 0, turnCount = 0;
  spiralCoords[1] = { x: 0, y: 0 };
  for (let n = 2; n <= MAX_N; n++) {
    x += dx; y += dy;
    spiralCoords[n] = { x, y };
    stepCount++;
    if (stepCount === steps) {
      stepCount = 0;
      // Turn left
      const tmp = dx; dx = -dy; dy = tmp;
      turnCount++;
      if (turnCount === 2) { turnCount = 0; steps++; }
    }
  }
})();

// Canvas setup
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', () => { resize(); draw(); });
resize();

// View state
let zoom = 1.0;
let panX = 0, panY = 0;
let primesOnly = false;
let showDiagonals = false;
let animProgress = MAX_N; // how many numbers to show
let animating = false;
let animStart = 0;
const ANIM_DURATION = 4000; // ms

// Interaction
let dragging = false, dragX = 0, dragY = 0;

canvas.addEventListener('mousedown', e => {
  dragging = true; dragX = e.clientX; dragY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (dragging) {
    panX += e.clientX - dragX;
    panY += e.clientY - dragY;
    dragX = e.clientX; dragY = e.clientY;
    draw();
  }
  updateHover(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => { dragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const mx = e.clientX, my = e.clientY;
  // Zoom toward mouse
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  zoom *= factor;
  zoom = Math.max(0.15, Math.min(zoom, 20));
  draw();
}, { passive: false });

// Map number to screen position
function numToScreen(n) {
  if (!spiralCoords[n]) return null;
  const c = spiralCoords[n];
  const cx = W / 2 + panX;
  const cy = H / 2 + panY;
  return {
    x: cx + c.x * CELL * zoom,
    y: cy + c.y * CELL * zoom
  };
}

// Map screen to number
function screenToNum(sx, sy) {
  const cx = W / 2 + panX;
  const cy = H / 2 + panY;
  const gridX = Math.round((sx - cx) / (CELL * zoom));
  const gridY = Math.round((sy - cy) / (CELL * zoom));
  for (let n = 1; n <= animProgress; n++) {
    const c = spiralCoords[n];
    if (c.x === gridX && c.y === gridY) return n;
  }
  return null;
}

// Get color for a prime based on mod 7
function primeColor(p) {
  return MOD7_COLORS[p % 7];
}

// Get faint tint for composite divisible by shield prime
function compositeTint(n) {
  for (let i = 0; i < SHIELD_PRIMES.length; i++) {
    if (n % SHIELD_PRIMES[i] === 0) return SHIELD_COLORS[i];
  }
  return null;
}

function hexToRgb(hex) {
  let r, g, b;
  if (hex.length === 4) {
    r = parseInt(hex[1] + hex[1], 16);
    g = parseInt(hex[2] + hex[2], 16);
    b = parseInt(hex[3] + hex[3], 16);
  } else {
    r = parseInt(hex.slice(1, 3), 16);
    g = parseInt(hex.slice(3, 5), 16);
    b = parseInt(hex.slice(5, 7), 16);
  }
  return [r, g, b];
}

// Draw
function draw() {
  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, W, H);

  const cs = CELL * zoom;
  const cx = W / 2 + panX;
  const cy = H / 2 + panY;

  // Determine visible range
  const margin = cs * 2;
  let primesVisible = 0, twinsVisible = 0, mersenneVisible = 0;
  let minVisible = Infinity, maxVisible = 0, totalVisible = 0;

  // Draw diagonals hint
  if (showDiagonals) {
    ctx.strokeStyle = 'rgba(0,170,255,0.06)';
    ctx.lineWidth = 1;
    const extent = 200 * cs;
    for (let d = -1; d <= 1; d += 2) {
      for (let e = -1; e <= 1; e += 2) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + d * extent, cy + e * extent);
        ctx.stroke();
      }
    }
    // Also the axis-aligned
    ctx.strokeStyle = 'rgba(0,170,255,0.03)';
    ctx.beginPath(); ctx.moveTo(cx - extent, cy); ctx.lineTo(cx + extent, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - extent); ctx.lineTo(cx, cy + extent); ctx.stroke();
  }

  const limit = Math.min(animProgress, MAX_N);

  for (let n = 1; n <= limit; n++) {
    const c = spiralCoords[n];
    const sx = cx + c.x * cs;
    const sy = cy + c.y * cs;

    // Cull offscreen
    if (sx < -margin || sx > W + margin || sy < -margin || sy > H + margin) continue;

    totalVisible++;
    if (n < minVisible) minVisible = n;
    if (n > maxVisible) maxVisible = n;

    const ip = isPrime[n];
    const isShield = SHIELD_PRIMES.includes(n);
    const is127 = n === 127;
    const isMersenne = MERSENNE_NUMBERS.has(n);

    if (primesOnly && !ip) continue;

    const half = cs * 0.42;

    if (ip) {
      primesVisible++;
      if (twinPrimeSet.has(n)) twinsVisible++;
      if (isMersenne) mersenneVisible++;

      const col = primeColor(n);
      const [r, g, b] = hexToRgb(col);

      // Glow for shield primes
      if (isShield || is127) {
        const glowCol = is127 ? 'rgba(255,215,0,' : `rgba(${r},${g},${b},`;
        const glowSize = is127 ? cs * 2.5 : cs * 1.8;
        const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowSize);
        grad.addColorStop(0, glowCol + '0.6)');
        grad.addColorStop(0.5, glowCol + '0.15)');
        grad.addColorStop(1, glowCol + '0)');
        ctx.fillStyle = grad;
        ctx.fillRect(sx - glowSize, sy - glowSize, glowSize * 2, glowSize * 2);
      }

      // Mersenne outline
      if (isMersenne) {
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = Math.max(1, zoom * 0.8);
        ctx.strokeRect(sx - half - 1.5, sy - half - 1.5, half * 2 + 3, half * 2 + 3);
      }

      // Prime cell
      ctx.fillStyle = col;
      ctx.fillRect(sx - half, sy - half, half * 2, half * 2);

      // Label for shield primes if zoomed enough
      if ((isShield || is127) && cs > 10) {
        ctx.fillStyle = is127 ? '#ffd700' : '#fff';
        ctx.font = `bold ${Math.max(7, cs * 0.55)}px 'Courier New'`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(n), sx, sy);
      }
    } else {
      // Composite
      const tint = compositeTint(n);
      if (tint) {
        const [r, g, b] = hexToRgb(tint);
        ctx.fillStyle = `rgba(${r},${g},${b},0.08)`;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
      }
      ctx.fillRect(sx - half, sy - half, half * 2, half * 2);
    }
  }

  // Update info panel
  document.getElementById('ip-zoom').textContent = zoom.toFixed(2) + 'x';
  document.getElementById('ip-range').textContent = (minVisible === Infinity ? '-' : minVisible + '-' + maxVisible);
  document.getElementById('ip-primes').textContent = primesVisible;
  document.getElementById('ip-density').textContent = totalVisible > 0 ? (primesVisible / totalVisible * 100).toFixed(1) + '%' : '0%';

  document.getElementById('bm-primes').textContent = primesVisible;
  document.getElementById('bm-density').textContent = totalVisible > 0 ? (primesVisible / totalVisible * 100).toFixed(1) + '%' : '0%';
  document.getElementById('bm-twins').textContent = Math.floor(twinsVisible / 2);
  document.getElementById('bm-mersenne').textContent = mersenneVisible;
}

// Hover
function updateHover(mx, my) {
  const hp = document.getElementById('hover-panel');
  const n = screenToNum(mx, my);
  if (!n) { hp.style.display = 'none'; return; }

  hp.style.display = 'block';
  hp.style.left = (mx + 16) + 'px';
  hp.style.top = (my - 10) + 'px';

  document.getElementById('hp-num').textContent = '#' + n;

  const ip = isPrime[n];
  let info = ip ? 'PRIME' : 'COMPOSITE';
  if (SHIELD_PRIMES.includes(n)) info += ' [SHIELD PRIME]';
  if (n === 127) info += ' [M7 MERSENNE]';
  if (MERSENNE_NUMBERS.has(n) && n !== 127) info += ' [MERSENNE 2^n-1]';
  if (twinPrimeSet.has(n)) info += ' [TWIN]';
  document.getElementById('hp-info').textContent = info;

  if (!ip && n > 1) {
    const f = factorize(n);
    // Group factors
    const counts = {};
    f.forEach(p => { counts[p] = (counts[p] || 0) + 1; });
    const parts = Object.entries(counts).map(([p, c]) => c > 1 ? p + '^' + c : p);
    document.getElementById('hp-factors').textContent = parts.join(' x ');
  } else {
    document.getElementById('hp-factors').textContent = ip ? 'indivisible' : '';
  }
}

// Controls
function togglePrimesOnly() {
  primesOnly = !primesOnly;
  document.getElementById('btn-primes').classList.toggle('active', primesOnly);
  draw();
}

function toggleDiagonals() {
  showDiagonals = !showDiagonals;
  document.getElementById('btn-diagonals').classList.toggle('active', showDiagonals);
  draw();
}

function find127() {
  const pos = numToScreen(127);
  if (!pos) return;
  // Animate zoom to 127
  const targetZoom = 5;
  const c = spiralCoords[127];
  zoom = targetZoom;
  panX = -c.x * CELL * zoom;
  panY = -c.y * CELL * zoom;
  draw();
  // Flash effect
  let flash = 0;
  const flashInterval = setInterval(() => {
    flash++;
    draw();
    const pos2 = numToScreen(127);
    if (pos2) {
      ctx.beginPath();
      ctx.arc(pos2.x, pos2.y, 20 + flash * 2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,215,0,${Math.max(0, 1 - flash / 12)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    if (flash > 12) clearInterval(flashInterval);
  }, 60);
}

function replayAnimation() {
  animProgress = 0;
  animating = true;
  animStart = performance.now();
  requestAnimationFrame(animate);
}

function animate(t) {
  if (!animating) return;
  const elapsed = t - animStart;
  // Ease-out: fast at start, slowing down
  const progress = Math.min(1, elapsed / ANIM_DURATION);
  const eased = 1 - Math.pow(1 - progress, 3);
  animProgress = Math.floor(eased * MAX_N);
  draw();
  if (progress < 1) {
    requestAnimationFrame(animate);
  } else {
    animProgress = MAX_N;
    animating = false;
    draw();
  }
}

// Initial animated build
animProgress = 0;
animating = true;
animStart = performance.now();
requestAnimationFrame(animate);
</script>
</body>

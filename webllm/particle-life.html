<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Life — Artificial Chemistry</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #c0d8ff;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  user-select: none;
}

/* --- Canvas --- */
canvas#life {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
}

/* --- CRT Scanline overlay --- */
#crt-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 200;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.04) 0px,
    rgba(0,0,0,0.04) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* --- HUD corner brackets --- */
.hud-corner {
  position: fixed;
  width: 28px; height: 28px;
  z-index: 150;
  pointer-events: none;
}
.hud-corner::before, .hud-corner::after {
  content: '';
  position: absolute;
  background: rgba(0,229,255,0.35);
}
.hud-tl { top: 8px; left: 228px; }
.hud-tl::before { top: 0; left: 0; width: 20px; height: 1px; }
.hud-tl::after  { top: 0; left: 0; width: 1px; height: 20px; }
.hud-tr { top: 8px; right: 208px; }
.hud-tr::before { top: 0; right: 0; width: 20px; height: 1px; }
.hud-tr::after  { top: 0; right: 0; width: 1px; height: 20px; }
.hud-bl { bottom: 44px; left: 228px; }
.hud-bl::before { bottom: 0; left: 0; width: 20px; height: 1px; }
.hud-bl::after  { bottom: 0; left: 0; width: 1px; height: 20px; }
.hud-br { bottom: 44px; right: 208px; }
.hud-br::before { bottom: 0; right: 0; width: 20px; height: 1px; }
.hud-br::after  { bottom: 0; right: 0; width: 1px; height: 20px; }

/* --- Header --- */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 42px;
  z-index: 120;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: rgba(10,10,25,0.9);
  border-bottom: 1px solid rgba(100,200,255,0.15);
  backdrop-filter: blur(12px);
}
#header-title {
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #c0d8ff;
  background: linear-gradient(90deg, #00e5ff, #ffd700, #ff00ff, #00ff88, #00e5ff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradShift 8s linear infinite;
}
@keyframes gradShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
.status-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #7a9bb5;
  text-transform: uppercase;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #00ff88;
  box-shadow: 0 0 6px #00ff88;
  animation: dotPulse 2s ease-in-out infinite;
}
.status-dot.inactive { background: #555; box-shadow: none; animation: none; }
@keyframes dotPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* --- Panels base --- */
.panel {
  position: fixed;
  z-index: 110;
  background: rgba(10,10,25,0.85);
  border: 1px solid rgba(100,200,255,0.15);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 10px;
  letter-spacing: 1px;
  backdrop-filter: blur(12px);
  pointer-events: all;
}
.panel h3 {
  font-size: 9px;
  letter-spacing: 2.5px;
  color: #00e5ff;
  margin-bottom: 10px;
  text-transform: uppercase;
  font-weight: normal;
  border-bottom: 1px solid rgba(0,229,255,0.15);
  padding-bottom: 6px;
}
.panel-label {
  color: #556680;
  font-size: 9px;
  margin-top: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.panel-value {
  color: #c0d8ff;
  font-size: 11px;
}

/* --- Left Panel: Interaction Matrix --- */
#left-panel {
  top: 50px;
  left: 8px;
  width: 220px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
#left-panel::-webkit-scrollbar { width: 3px; }
#left-panel::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 2px; }

/* Matrix grid */
#matrix-container {
  margin: 8px 0;
}
#matrix-header {
  display: flex;
  gap: 2px;
  margin-left: 26px;
  margin-bottom: 2px;
}
.matrix-col-label {
  width: 26px;
  height: 14px;
  text-align: center;
  font-size: 8px;
  color: #889;
}
.matrix-row {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 2px;
}
.matrix-row-label {
  width: 24px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  border-radius: 3px;
}
.matrix-cell {
  width: 26px;
  height: 26px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7px;
  color: rgba(255,255,255,0.6);
}
.matrix-cell:hover {
  border-color: rgba(255,255,255,0.3);
  transform: scale(1.15);
  z-index: 5;
}

/* Preset buttons */
#preset-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin: 10px 0;
}
.preset-btn {
  padding: 5px 6px;
  font: 9px 'Courier New', monospace;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(100,200,255,0.12);
  border-radius: 6px;
  color: #7a9bb5;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  letter-spacing: 0.8px;
}
.preset-btn:hover {
  border-color: #00e5ff;
  color: #00e5ff;
  background: rgba(0,229,255,0.05);
}
.preset-btn.active {
  border-color: #00ff88;
  color: #00ff88;
  background: rgba(0,255,136,0.06);
}

/* Species sliders */
.species-slider-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 3px 0;
  font-size: 9px;
}
.species-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.species-slider-row input[type="range"] {
  flex: 1;
  height: 3px;
  accent-color: #00e5ff;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  -webkit-appearance: none;
  appearance: none;
}
.species-slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #00e5ff;
  cursor: pointer;
}
.species-count {
  width: 24px;
  text-align: right;
  color: #889;
}

/* --- Right Panel: Voice & Stats --- */
#right-panel {
  top: 50px;
  right: 8px;
  width: 200px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
#right-panel::-webkit-scrollbar { width: 3px; }
#right-panel::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 2px; }

/* Voice drive toggle */
#voice-toggle {
  width: 100%;
  padding: 7px;
  font: 10px 'Courier New', monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(100,200,255,0.12);
  border-radius: 8px;
  color: #7a9bb5;
  cursor: pointer;
  transition: all 0.3s;
  margin-bottom: 10px;
}
#voice-toggle:hover {
  border-color: #ffd700;
  color: #ffd700;
}
#voice-toggle.active {
  border-color: #00ff88;
  color: #00ff88;
  background: rgba(0,255,136,0.06);
  box-shadow: 0 0 12px rgba(0,255,136,0.1);
}

/* Voice analysis */
#volume-meter {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  margin: 4px 0;
}
#volume-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00e5ff, #ffd700);
  border-radius: 3px;
  transition: width 0.05s;
}
#pitch-display {
  font-size: 11px;
  color: #ffd700;
  margin: 3px 0;
}
#vowel-display {
  font-size: 16px;
  color: #ff00ff;
  text-align: center;
  margin: 4px 0;
  min-height: 22px;
  letter-spacing: 4px;
}

/* Population stats */
.pop-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 2px 0;
  font-size: 9px;
}
.pop-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pop-bar-wrap {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.04);
  border-radius: 2px;
  overflow: hidden;
}
.pop-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}
.pop-count {
  width: 26px;
  text-align: right;
  color: #889;
}

/* Behavior detection */
#behavior-label {
  font-size: 12px;
  color: #ffd700;
  text-align: center;
  margin: 6px 0;
  padding: 4px;
  border: 1px solid rgba(255,215,0,0.15);
  border-radius: 6px;
  background: rgba(255,215,0,0.03);
  min-height: 22px;
  letter-spacing: 1.5px;
}

/* Sliders */
.slider-group {
  margin: 6px 0;
}
.slider-group label {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: #556680;
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.slider-group label span { color: #c0d8ff; }
.slider-group input[type="range"] {
  width: 100%;
  height: 3px;
  accent-color: #00e5ff;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
}
.slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #00e5ff;
  cursor: pointer;
}

/* FPS */
#fps-display {
  font-size: 9px;
  color: #556680;
  text-align: right;
  margin-top: 8px;
  letter-spacing: 1px;
}

/* --- Bottom bar --- */
#bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  z-index: 120;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: rgba(10,10,25,0.9);
  border-top: 1px solid rgba(100,200,255,0.12);
  backdrop-filter: blur(12px);
  padding: 0 230px;
}
.spectrum-bar {
  flex: 1;
  max-width: 8px;
  height: 4px;
  background: rgba(0,229,255,0.3);
  border-radius: 2px;
  transition: height 0.06s, background 0.1s;
}

/* --- Keyboard hints --- */
#keyboard-hints {
  position: fixed;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 115;
  display: flex;
  gap: 8px;
  font-size: 8px;
  color: #3a4a5a;
  letter-spacing: 1px;
  pointer-events: none;
}
.kbd {
  padding: 2px 5px;
  border: 1px solid rgba(100,200,255,0.1);
  border-radius: 3px;
  color: #556680;
}

/* --- Shockwave ring --- */
@keyframes shockwave {
  0% { transform: translate(-50%,-50%) scale(0); opacity: 0.7; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}
.shockwave-ring {
  position: absolute;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 90;
  animation: shockwave 0.8s ease-out forwards;
}
</style>
</head>
<body>
<canvas id="life"></canvas>
<div id="crt-overlay"></div>

<!-- HUD corners -->
<div class="hud-corner hud-tl"></div>
<div class="hud-corner hud-tr"></div>
<div class="hud-corner hud-bl"></div>
<div class="hud-corner hud-br"></div>

<!-- Header -->
<div id="header">
  <span id="header-title">Particle Life</span>
  <div class="status-pill">
    <div class="status-dot" id="sim-dot"></div>
    <span id="sim-status">RUNNING</span>
  </div>
  <div class="status-pill">
    <div class="status-dot inactive" id="voice-dot"></div>
    <span>VOICE</span>
  </div>
</div>

<!-- Left Panel: Matrix -->
<div class="panel" id="left-panel">
  <h3>Interaction Matrix</h3>
  <div id="matrix-container"></div>

  <h3 style="margin-top:12px">Presets</h3>
  <div id="preset-grid">
    <button class="preset-btn" data-preset="random">Random</button>
    <button class="preset-btn" data-preset="chaos">Chaos</button>
    <button class="preset-btn" data-preset="symbiosis">Symbiosis</button>
    <button class="preset-btn" data-preset="predprey">Predator-Prey</button>
    <button class="preset-btn" data-preset="crystals">Crystals</button>
    <button class="preset-btn" data-preset="worms">Worms</button>
  </div>

  <h3 style="margin-top:12px">Species Count</h3>
  <div id="species-sliders"></div>
</div>

<!-- Right Panel: Voice & Stats -->
<div class="panel" id="right-panel">
  <h3>Voice Drive</h3>
  <button id="voice-toggle">&#9679; Voice Drive Off</button>

  <div id="voice-analysis" style="display:none">
    <div class="panel-label">Volume</div>
    <div id="volume-meter"><div id="volume-fill"></div></div>
    <div class="panel-label">Pitch</div>
    <div id="pitch-display">— Hz</div>
    <div class="panel-label">Detected Vowel</div>
    <div id="vowel-display">—</div>
  </div>

  <h3 style="margin-top:14px">Population</h3>
  <div id="pop-stats"></div>

  <h3 style="margin-top:14px">Behavior</h3>
  <div id="behavior-label">Initializing...</div>

  <h3 style="margin-top:14px">Controls</h3>
  <div class="slider-group">
    <label>Interaction Radius <span id="radius-val">80</span></label>
    <input type="range" id="radius-slider" min="30" max="200" value="80">
  </div>
  <div class="slider-group">
    <label>Friction <span id="friction-val">0.50</span></label>
    <input type="range" id="friction-slider" min="10" max="95" value="50">
  </div>
  <div class="slider-group">
    <label>Trail Fade <span id="trail-val">0.08</span></label>
    <input type="range" id="trail-slider" min="1" max="40" value="8">
  </div>

  <div id="fps-display">FPS: --</div>
</div>

<!-- Bottom bar: spectrum -->
<div id="bottom-bar"></div>

<!-- Keyboard hints -->
<div id="keyboard-hints">
  <span><span class="kbd">1-6</span> species</span>
  <span><span class="kbd">R</span> random</span>
  <span><span class="kbd">Space</span> voice</span>
  <span><span class="kbd">B</span> bang</span>
  <span><span class="kbd">P</span> pause</span>
</div>

<script>
// ============================================================
//  PARTICLE LIFE — ARTIFICIAL CHEMISTRY ENGINE
// ============================================================

// --- Constants & Config ---
const SPECIES_COLORS = [
  '#ff4444', // red
  '#44ff44', // green
  '#4488ff', // blue
  '#ffdd44', // yellow
  '#00e5ff', // cyan
  '#ff44ff'  // magenta
];
const SPECIES_NAMES = ['R', 'G', 'B', 'Y', 'C', 'M'];
const SPECIES_FULL = ['Red', 'Green', 'Blue', 'Yellow', 'Cyan', 'Magenta'];
const NUM_SPECIES = 6;
const DEFAULT_COUNT = 75;
const MIN_RADIUS = 8;

// --- State ---
let paused = false;
let voiceActive = false;
let speciesCounts = new Array(NUM_SPECIES).fill(DEFAULT_COUNT);
let speciesVisible = new Array(NUM_SPECIES).fill(true);
let interactionRadius = 80;
let friction = 0.5;
let trailFade = 0.08;
let voiceSpeedMult = 1.0;
let voiceGlowMult = 1.0;
let voiceRadiusOffset = 0;
let voiceMatrixShifts = new Float32Array(NUM_SPECIES);
let particles = [];
let matrix = [];
let activePreset = null;

// --- Canvas setup ---
const canvas = document.getElementById('life');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Background stars (127 Fibonacci sphere projected to 2D) ---
const NUM_STARS = 127;
const stars = [];
(function initStars() {
  const golden = (1 + Math.sqrt(5)) / 2;
  for (let i = 0; i < NUM_STARS; i++) {
    const theta = 2 * Math.PI * i / golden;
    const phi = Math.acos(1 - 2 * (i + 0.5) / NUM_STARS);
    const x = Math.sin(phi) * Math.cos(theta);
    const y = Math.sin(phi) * Math.sin(theta);
    stars.push({
      x: (x * 0.45 + 0.5),
      y: (y * 0.45 + 0.5),
      size: 0.5 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.7
    });
  }
})();

// --- Spatial Hash Grid ---
const GRID_SIZE = 100;
let gridCols, gridRows, grid;

function initGrid() {
  gridCols = Math.ceil(W / GRID_SIZE);
  gridRows = Math.ceil(H / GRID_SIZE);
  grid = new Array(gridCols * gridRows);
  for (let i = 0; i < grid.length; i++) grid[i] = [];
}

function clearGrid() {
  for (let i = 0; i < grid.length; i++) grid[i].length = 0;
}

function addToGrid(p) {
  const cx = Math.floor(p.x / GRID_SIZE);
  const cy = Math.floor(p.y / GRID_SIZE);
  const idx = ((cy % gridRows) + gridRows) % gridRows * gridCols + ((cx % gridCols) + gridCols) % gridCols;
  if (idx >= 0 && idx < grid.length) grid[idx].push(p);
}

function getNeighborCells(cx, cy) {
  const result = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const nx = ((cx + dx) % gridCols + gridCols) % gridCols;
      const ny = ((cy + dy) % gridRows + gridRows) % gridRows;
      const cell = grid[ny * gridCols + nx];
      if (cell) result.push(cell);
    }
  }
  return result;
}

initGrid();

// ============================================================
//  INTERACTION MATRIX
// ============================================================

function randomMatrix() {
  matrix = [];
  for (let i = 0; i < NUM_SPECIES; i++) {
    matrix[i] = [];
    for (let j = 0; j < NUM_SPECIES; j++) {
      matrix[i][j] = Math.random() * 2 - 1;
    }
  }
}

const PRESETS = {
  random: () => { randomMatrix(); },
  chaos: () => {
    for (let i = 0; i < NUM_SPECIES; i++) {
      matrix[i] = [];
      for (let j = 0; j < NUM_SPECIES; j++) {
        matrix[i][j] = (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
      }
    }
  },
  symbiosis: () => {
    for (let i = 0; i < NUM_SPECIES; i++) {
      matrix[i] = [];
      for (let j = 0; j < NUM_SPECIES; j++) {
        if (i === j) matrix[i][j] = 0.1 + Math.random() * 0.3;
        else if ((i + 1) % NUM_SPECIES === j) matrix[i][j] = 0.6 + Math.random() * 0.3;
        else if ((j + 1) % NUM_SPECIES === i) matrix[i][j] = 0.6 + Math.random() * 0.3;
        else matrix[i][j] = -0.1 + Math.random() * 0.2;
      }
    }
  },
  predprey: () => {
    for (let i = 0; i < NUM_SPECIES; i++) {
      matrix[i] = [];
      for (let j = 0; j < NUM_SPECIES; j++) {
        if (i === j) matrix[i][j] = 0.15;
        else if ((i + 1) % NUM_SPECIES === j) matrix[i][j] = 0.8;   // chases next
        else if ((i + NUM_SPECIES - 1) % NUM_SPECIES === j) matrix[i][j] = -0.8; // flees previous
        else matrix[i][j] = 0;
      }
    }
  },
  crystals: () => {
    for (let i = 0; i < NUM_SPECIES; i++) {
      matrix[i] = [];
      for (let j = 0; j < NUM_SPECIES; j++) {
        if (i === j) matrix[i][j] = 0.6;
        else if (Math.abs(i - j) === 1 || Math.abs(i - j) === NUM_SPECIES - 1) matrix[i][j] = 0.3;
        else matrix[i][j] = -0.5;
      }
    }
  },
  worms: () => {
    for (let i = 0; i < NUM_SPECIES; i++) {
      matrix[i] = [];
      for (let j = 0; j < NUM_SPECIES; j++) {
        if (i === j) matrix[i][j] = 0.7;
        else if ((i + 1) % NUM_SPECIES === j) matrix[i][j] = 0.5;
        else matrix[i][j] = -0.3 - Math.random() * 0.3;
      }
    }
  }
};

randomMatrix();

// ============================================================
//  PARTICLES
// ============================================================

function createParticle(species) {
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    species: species
  };
}

function spawnParticles() {
  particles = [];
  for (let s = 0; s < NUM_SPECIES; s++) {
    for (let i = 0; i < speciesCounts[s]; i++) {
      particles.push(createParticle(s));
    }
  }
}

function respawnSpecies() {
  // Adjust particle counts to match sliders
  const current = new Array(NUM_SPECIES).fill(0);
  particles.forEach(p => current[p.species]++);

  for (let s = 0; s < NUM_SPECIES; s++) {
    const diff = speciesCounts[s] - current[s];
    if (diff > 0) {
      for (let i = 0; i < diff; i++) particles.push(createParticle(s));
    } else if (diff < 0) {
      let toRemove = -diff;
      for (let i = particles.length - 1; i >= 0 && toRemove > 0; i--) {
        if (particles[i].species === s) {
          particles.splice(i, 1);
          toRemove--;
        }
      }
    }
  }
}

spawnParticles();

// ============================================================
//  PHYSICS UPDATE
// ============================================================

function updatePhysics() {
  const maxR = interactionRadius + voiceRadiusOffset;
  const halfW = W / 2;
  const halfH = H / 2;
  const fric = friction;
  const speedMult = voiceSpeedMult;

  // Rebuild spatial grid
  clearGrid();
  for (let i = 0; i < particles.length; i++) addToGrid(particles[i]);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let fx = 0, fy = 0;

    const cx = Math.floor(p.x / GRID_SIZE);
    const cy = Math.floor(p.y / GRID_SIZE);

    // Check neighbor grid cells
    for (let dx = -2; dx <= 2; dx++) {
      for (let dy = -2; dy <= 2; dy++) {
        const nx = ((cx + dx) % gridCols + gridCols) % gridCols;
        const ny = ((cy + dy) % gridRows + gridRows) % gridRows;
        const cell = grid[ny * gridCols + nx];
        if (!cell) continue;

        for (let k = 0; k < cell.length; k++) {
          const q = cell[k];
          if (p === q) continue;

          // Toroidal distance
          let ddx = q.x - p.x;
          let ddy = q.y - p.y;
          if (ddx > halfW) ddx -= W;
          else if (ddx < -halfW) ddx += W;
          if (ddy > halfH) ddy -= H;
          else if (ddy < -halfH) ddy += H;

          const dist = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dist < 0.5 || dist > maxR) continue;

          const invDist = 1 / dist;
          let force;

          if (dist < MIN_RADIUS) {
            // Strong repulsion below min radius
            force = (MIN_RADIUS / dist - 1) * (-5);
          } else {
            // Attraction/repulsion based on matrix + voice shifts
            let attr = matrix[p.species][q.species];
            // Apply voice-driven matrix shifts
            if (voiceActive) {
              attr += voiceMatrixShifts[p.species] * 0.3;
              attr = Math.max(-1, Math.min(1, attr));
            }
            force = attr * (1 - dist / maxR);
          }

          fx += ddx * invDist * force;
          fy += ddy * invDist * force;
        }
      }
    }

    p.vx = (p.vx + fx) * fric * speedMult;
    p.vy = (p.vy + fy) * fric * speedMult;

    p.x += p.vx;
    p.y += p.vy;

    // Wrap around
    if (p.x < 0) p.x += W;
    else if (p.x >= W) p.x -= W;
    if (p.y < 0) p.y += H;
    else if (p.y >= H) p.y -= H;
  }
}

// ============================================================
//  RENDERING
// ============================================================

let connectionPairs = []; // recalculated periodically

function drawStars(time) {
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const brightness = 0.15 + 0.15 * Math.sin(time * 0.001 * s.speed + s.phase);
    ctx.fillStyle = `rgba(180,200,255,${brightness})`;
    ctx.fillRect(s.x * W, s.y * H, s.size, s.size);
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!speciesVisible[p.species]) continue;

    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const glow = Math.min(1, 0.3 + speed * 0.3) * voiceGlowMult;
    const radius = 2 + speed * 0.5;
    const color = SPECIES_COLORS[p.species];

    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = glow;
    ctx.fill();

    // Glow halo
    if (speed > 1.5 || voiceGlowMult > 1.2) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius + 3, 0, Math.PI * 2);
      ctx.globalAlpha = glow * 0.2;
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// Draw faint connection lines between strongly attracted nearby pairs
let connectionFrame = 0;
function drawConnections() {
  connectionFrame++;
  if (connectionFrame % 6 !== 0) {
    // Use cached pairs
    for (let i = 0; i < connectionPairs.length; i++) {
      const pair = connectionPairs[i];
      ctx.beginPath();
      ctx.moveTo(pair[0], pair[1]);
      ctx.lineTo(pair[2], pair[3]);
      ctx.strokeStyle = pair[4];
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = pair[5];
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    return;
  }

  connectionPairs = [];
  const maxR = interactionRadius + voiceRadiusOffset;
  const halfW = W / 2;
  const halfH = H / 2;

  // Only check a subset for performance
  const step = Math.max(1, Math.floor(particles.length / 200));
  for (let i = 0; i < particles.length; i += step) {
    const p = particles[i];
    if (!speciesVisible[p.species]) continue;

    for (let j = i + 1; j < Math.min(i + 30, particles.length); j++) {
      const q = particles[j];
      if (!speciesVisible[q.species]) continue;

      const attr = matrix[p.species][q.species];
      if (attr < 0.4) continue;

      let ddx = q.x - p.x;
      let ddy = q.y - p.y;
      if (ddx > halfW) ddx -= W;
      else if (ddx < -halfW) ddx += W;
      if (ddy > halfH) ddy -= H;
      else if (ddy < -halfH) ddy += H;

      const dist = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dist > maxR * 0.6) continue;

      const alpha = (1 - dist / (maxR * 0.6)) * attr * 0.15;
      const mixColor = SPECIES_COLORS[p.species];
      connectionPairs.push([p.x, p.y, p.x + ddx, p.y + ddy, mixColor, alpha]);
    }
  }

  // Draw them
  for (let i = 0; i < connectionPairs.length; i++) {
    const pair = connectionPairs[i];
    ctx.beginPath();
    ctx.moveTo(pair[0], pair[1]);
    ctx.lineTo(pair[2], pair[3]);
    ctx.strokeStyle = pair[4];
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = pair[5];
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  SHOCKWAVE / BIG BANG
// ============================================================

let shockwaves = [];

function triggerBigBang() {
  const centerX = W / 2;
  const centerY = H / 2;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let dx = p.x - centerX;
    let dy = p.y - centerY;
    const dist = Math.sqrt(dx * dx + dy * dy) + 1;
    const force = 15 + Math.random() * 10;
    p.vx += (dx / dist) * force;
    p.vy += (dy / dist) * force;
  }

  // Visual shockwave
  shockwaves.push({
    x: centerX,
    y: centerY,
    maxSize: Math.max(W, H) * 0.8,
    time: 0,
    duration: 50
  });
}

function drawShockwaves() {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.time++;
    const t = sw.time / sw.duration;
    if (t >= 1) { shockwaves.splice(i, 1); continue; }
    const r = sw.maxSize * t;
    const alpha = (1 - t) * 0.5;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = 2 + (1 - t) * 4;
    ctx.stroke();

    // Inner ring
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, r * 0.7, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,229,255,${alpha * 0.5})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ============================================================
//  BEHAVIOR DETECTION
// ============================================================

let lastBehavior = 'Initializing...';
let behaviorFrame = 0;

function detectBehavior() {
  behaviorFrame++;
  if (behaviorFrame % 30 !== 0) return lastBehavior;

  if (particles.length === 0) return 'Empty';

  // Sample particles for heuristics
  const sampleSize = Math.min(100, particles.length);
  const step = Math.max(1, Math.floor(particles.length / sampleSize));

  let totalSpeed = 0;
  let totalNNDist = 0;
  let alignmentX = 0, alignmentY = 0;
  let clusterCount = 0;
  let sampleCount = 0;

  for (let i = 0; i < particles.length; i += step) {
    const p = particles[i];
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    totalSpeed += speed;
    alignmentX += p.vx / (speed + 0.01);
    alignmentY += p.vy / (speed + 0.01);
    sampleCount++;

    // Find nearest neighbor distance (check next few particles)
    let minDist = Infinity;
    for (let j = 1; j <= 5 && i + j < particles.length; j++) {
      const q = particles[i + j];
      const dx = p.x - q.x;
      const dy = p.y - q.y;
      minDist = Math.min(minDist, Math.sqrt(dx * dx + dy * dy));
    }
    if (minDist < 30) clusterCount++;
    totalNNDist += minDist;
  }

  const avgSpeed = totalSpeed / sampleCount;
  const avgNNDist = totalNNDist / sampleCount;
  const alignment = Math.sqrt(alignmentX * alignmentX + alignmentY * alignmentY) / sampleCount;
  const clusterRatio = clusterCount / sampleCount;

  let behavior;
  if (avgSpeed > 6) behavior = 'Exploding';
  else if (clusterRatio > 0.7 && avgSpeed < 1.5) behavior = 'Crystallizing';
  else if (clusterRatio > 0.5 && avgSpeed < 2.5) behavior = 'Clustering';
  else if (alignment > 0.4 && avgSpeed > 2) behavior = 'Swarming';
  else if (avgSpeed > 3 && clusterRatio > 0.3) behavior = 'Chasing';
  else if (avgSpeed > 1.5 && avgNNDist > 40 && avgNNDist < 120) behavior = 'Orbiting';
  else if (avgSpeed < 0.8) behavior = 'Settling';
  else behavior = 'Flowing';

  lastBehavior = behavior;
  return behavior;
}

function buildMatrixUI() {
  const container = document.getElementById('matrix-container');
  container.innerHTML = '';

  // Column headers
  const headerRow = document.createElement('div');
  headerRow.id = 'matrix-header';
  headerRow.innerHTML = '<div style="width:24px"></div>';
  for (let j = 0; j < NUM_SPECIES; j++) {
    const lbl = document.createElement('div');
    lbl.className = 'matrix-col-label';
    lbl.style.color = SPECIES_COLORS[j];
    lbl.textContent = SPECIES_NAMES[j];
    headerRow.appendChild(lbl);
  }
  container.appendChild(headerRow);

  // Rows
  for (let i = 0; i < NUM_SPECIES; i++) {
    const row = document.createElement('div');
    row.className = 'matrix-row';

    const rowLbl = document.createElement('div');
    rowLbl.className = 'matrix-row-label';
    rowLbl.style.color = SPECIES_COLORS[i];
    rowLbl.style.background = hexToRGBA(SPECIES_COLORS[i], 0.1);
    rowLbl.textContent = SPECIES_NAMES[i];
    row.appendChild(rowLbl);

    for (let j = 0; j < NUM_SPECIES; j++) {
      const cell = document.createElement('div');
      cell.className = 'matrix-cell';
      cell.dataset.row = i;
      cell.dataset.col = j;
      updateCellColor(cell, matrix[i][j]);

      // Drag to adjust
      let dragging = false;
      let startY = 0;
      let startVal = 0;

      cell.addEventListener('mousedown', (e) => {
        dragging = true;
        startY = e.clientY;
        startVal = matrix[i][j];
        e.preventDefault();
      });

      cell.addEventListener('dblclick', () => {
        // Cycle: -1 -> 0 -> 1 -> -1
        let v = matrix[i][j];
        if (v < -0.3) v = 0;
        else if (v < 0.3) v = 1;
        else v = -1;
        matrix[i][j] = v;
        updateCellColor(cell, v);
        activePreset = null;
        clearPresetHighlight();
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const dy = startY - e.clientY;
        let v = startVal + dy * 0.01;
        v = Math.max(-1, Math.min(1, v));
        matrix[i][j] = Math.round(v * 100) / 100;
        updateCellColor(cell, matrix[i][j]);
      });

      window.addEventListener('mouseup', () => {
        if (dragging) {
          dragging = false;
          activePreset = null;
          clearPresetHighlight();
        }
      });

      row.appendChild(cell);
    }
    container.appendChild(row);
  }
}

function updateCellColor(cell, value) {
  let r, g, b;
  if (value < 0) {
    r = Math.floor(-value * 200 + 30);
    g = 20;
    b = 20;
  } else if (value > 0) {
    r = 20;
    g = Math.floor(value * 180 + 30);
    b = 20;
  } else {
    r = g = b = 30;
  }
  cell.style.background = `rgb(${r},${g},${b})`;
  cell.textContent = value.toFixed(1);
  cell.title = `${SPECIES_FULL[cell.dataset.row]} → ${SPECIES_FULL[cell.dataset.col]}: ${value.toFixed(2)}`;
}

function refreshMatrixUI() {
  const cells = document.querySelectorAll('.matrix-cell');
  cells.forEach(cell => {
    const i = parseInt(cell.dataset.row);
    const j = parseInt(cell.dataset.col);
    updateCellColor(cell, matrix[i][j]);
  });
}

function hexToRGBA(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const SPECTRUM_BARS = 64;
(function initBottomBar() {
  const bar = document.getElementById('bottom-bar');
  for (let i = 0; i < SPECTRUM_BARS; i++) {
    const b = document.createElement('div');
    b.className = 'spectrum-bar';
    b.id = `sbar-${i}`;
    bar.appendChild(b);
  }
})();

function updateBottomSpectrum(spectrumData) {
  if (!spectrumData) {
    // Generate spectrum from particle speeds
    const buckets = new Float32Array(SPECTRUM_BARS);
    const step = Math.max(1, Math.floor(particles.length / SPECTRUM_BARS));
    for (let i = 0; i < SPECTRUM_BARS; i++) {
      const idx = Math.min(i * step, particles.length - 1);
      if (idx >= 0 && particles[idx]) {
        const p = particles[idx];
        buckets[i] = Math.sqrt(p.vx * p.vx + p.vy * p.vy) * 3;
      }
    }
    spectrumData = buckets;
  }

  for (let i = 0; i < SPECTRUM_BARS; i++) {
    const bar = document.getElementById(`sbar-${i}`);
    if (!bar) continue;
    const h = Math.max(4, Math.min(32, spectrumData[i] || 4));
    const hue = 180 + (i / SPECTRUM_BARS) * 60;
    bar.style.height = h + 'px';
    bar.style.background = `hsla(${hue}, 80%, 60%, ${0.3 + h / 40})`;
  }
}

// ============================================================
//  VOICE / AUDIO ENGINE
// ============================================================

let audioCtx, analyser, micSource, dataArray, freqArray;

async function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micSource = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.8;
    micSource.connect(analyser);
    dataArray = new Float32Array(analyser.fftSize);
    freqArray = new Uint8Array(analyser.frequencyBinCount);
    return true;
  } catch (e) {
    console.warn('Microphone not available:', e);
    return false;
  }
}

function getRMS() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
  return Math.sqrt(sum / dataArray.length);
}

// Autocorrelation pitch detection
function detectPitch() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(dataArray);
  const buf = dataArray;
  const len = buf.length;

  // Check for silence
  let rms = 0;
  for (let i = 0; i < len; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / len);
  if (rms < 0.01) return 0;

  // Autocorrelation
  const minPeriod = Math.floor(audioCtx.sampleRate / 1000); // 1000 Hz max
  const maxPeriod = Math.floor(audioCtx.sampleRate / 60);   // 60 Hz min
  let bestCorr = -1;
  let bestPeriod = 0;

  for (let period = minPeriod; period < maxPeriod && period < len / 2; period++) {
    let corr = 0;
    for (let i = 0; i < len - period; i++) {
      corr += buf[i] * buf[i + period];
    }
    corr /= (len - period);
    if (corr > bestCorr) {
      bestCorr = corr;
      bestPeriod = period;
    }
  }

  if (bestPeriod === 0 || bestCorr < 0.01) return 0;
  return audioCtx.sampleRate / bestPeriod;
}

// 6-band frequency spectrum
function get6Bands() {
  if (!analyser) return new Float32Array(6);
  analyser.getByteFrequencyData(freqArray);
  const bands = new Float32Array(6);
  const binCount = freqArray.length;
  // Logarithmic bands: 0-100, 100-300, 300-800, 800-2000, 2000-5000, 5000-20000
  const edges = [0, 3, 8, 22, 55, 140, binCount];

  for (let b = 0; b < 6; b++) {
    let sum = 0;
    const count = edges[b + 1] - edges[b];
    for (let i = edges[b]; i < edges[b + 1]; i++) {
      sum += freqArray[i];
    }
    bands[b] = (sum / count) / 255;
  }
  return bands;
}

// Vowel detection based on formant ratios
let lastVowel = '—';
let vowelHoldTime = 0;

function detectVowel() {
  if (!analyser) return '—';
  analyser.getByteFrequencyData(freqArray);

  // Find two highest peaks in relevant range (200-3000 Hz)
  const sampleRate = audioCtx.sampleRate;
  const binWidth = sampleRate / analyser.fftSize;
  const minBin = Math.floor(200 / binWidth);
  const maxBin = Math.floor(3000 / binWidth);

  let peak1Bin = minBin, peak1Val = 0;
  let peak2Bin = minBin, peak2Val = 0;

  // Find first formant
  for (let i = minBin; i < Math.min(maxBin, Math.floor(1000 / binWidth)); i++) {
    if (freqArray[i] > peak1Val) {
      peak1Val = freqArray[i];
      peak1Bin = i;
    }
  }

  // Find second formant
  for (let i = Math.floor(800 / binWidth); i < maxBin; i++) {
    if (freqArray[i] > peak2Val && Math.abs(i - peak1Bin) > 3) {
      peak2Val = freqArray[i];
      peak2Bin = i;
    }
  }

  if (peak1Val < 30 || peak2Val < 20) {
    vowelHoldTime--;
    if (vowelHoldTime <= 0) lastVowel = '—';
    return lastVowel;
  }

  const f1 = peak1Bin * binWidth;
  const f2 = peak2Bin * binWidth;
  const f1Low = Math.min(f1, f2);
  const f2High = Math.max(f1, f2);
  const ratio = f2High / (f1Low + 1);

  let vowel;
  if (f1Low < 400 && ratio > 2.5) vowel = 'OO';       // oo
  else if (f1Low > 600 && f1Low < 900 && ratio < 2) vowel = 'AH'; // ah
  else if (f1Low < 450 && ratio > 3) vowel = 'EE';     // ee
  else if (f1Low > 400 && f1Low < 700 && ratio > 2) vowel = 'OH'; // oh
  else if (f1Low > 500 && ratio < 2.5) vowel = 'EH';   // eh
  else vowel = lastVowel;

  if (vowel !== '—') {
    lastVowel = vowel;
    vowelHoldTime = 20;
  }

  return lastVowel;
}

// Onset detection
let prevRMS = 0;
let onsetCooldown = 0;

function detectOnset() {
  const rms = getRMS();
  const delta = rms - prevRMS;
  prevRMS = rms;
  if (onsetCooldown > 0) { onsetCooldown--; return false; }
  if (delta > 0.15 && rms > 0.1) {
    onsetCooldown = 30;
    return true;
  }
  return false;
}

// Process voice each frame
function processVoice() {
  if (!voiceActive || !analyser) return;

  // 1. RMS → speed multiplier and glow
  const rms = getRMS();
  voiceSpeedMult = 1.0 + rms * 4;
  voiceGlowMult = 1.0 + rms * 3;

  // Update volume meter
  const volFill = document.getElementById('volume-fill');
  if (volFill) volFill.style.width = Math.min(100, rms * 500) + '%';

  // 2. Pitch → interaction radius offset
  const pitch = detectPitch();
  const pitchDisplay = document.getElementById('pitch-display');
  if (pitch > 0) {
    voiceRadiusOffset = Math.max(-30, Math.min(60, (300 - pitch) * 0.3));
    if (pitchDisplay) pitchDisplay.textContent = Math.round(pitch) + ' Hz';
  } else {
    voiceRadiusOffset *= 0.95;
    if (pitchDisplay) pitchDisplay.textContent = '— Hz';
  }

  // 3. 6-band spectrum → matrix row shifts
  const bands = get6Bands();
  for (let i = 0; i < NUM_SPECIES; i++) {
    voiceMatrixShifts[i] = (bands[i] - 0.3) * 2;
  }

  // 4. Vowel detection → preset switching
  const vowel = detectVowel();
  const vowelDisplay = document.getElementById('vowel-display');
  if (vowelDisplay) vowelDisplay.textContent = vowel;

  const vowelPresetMap = { 'OO': 'symbiosis', 'AH': 'chaos', 'EE': 'crystals', 'OH': 'predprey', 'EH': 'worms' };
  if (vowel !== '—' && vowelPresetMap[vowel] && vowelPresetMap[vowel] !== activePreset) {
    const presetName = vowelPresetMap[vowel];
    if (PRESETS[presetName]) {
      PRESETS[presetName]();
      refreshMatrixUI();
      activePreset = presetName;
      clearPresetHighlight();
      const btn = document.querySelector(`[data-preset="${presetName}"]`);
      if (btn) btn.classList.add('active');
    }
  }

  // 5. Onset detection → big bang
  if (detectOnset()) {
    triggerBigBang();
  }

  // Update voice spectrum in bottom bar
  const freqBars = new Float32Array(SPECTRUM_BARS);
  analyser.getByteFrequencyData(freqArray);
  const step = Math.floor(freqArray.length / SPECTRUM_BARS);
  for (let i = 0; i < SPECTRUM_BARS; i++) {
    freqBars[i] = (freqArray[i * step] / 255) * 30;
  }
  updateBottomSpectrum(freqBars);
}

// ============================================================
//  VOICE TOGGLE
// ============================================================

const voiceToggleBtn = document.getElementById('voice-toggle');
voiceToggleBtn.addEventListener('click', async () => {
  if (!voiceActive) {
    const ok = await initAudio();
    if (ok) {
      voiceActive = true;
      voiceToggleBtn.textContent = '\u25CF Voice Drive On';
      voiceToggleBtn.classList.add('active');
      document.getElementById('voice-analysis').style.display = 'block';
      document.getElementById('voice-dot').classList.remove('inactive');
    }
  } else {
    voiceActive = false;
    voiceSpeedMult = 1.0;
    voiceGlowMult = 1.0;
    voiceRadiusOffset = 0;
    voiceMatrixShifts.fill(0);
    voiceToggleBtn.textContent = '\u25CF Voice Drive Off';
    voiceToggleBtn.classList.remove('active');
    document.getElementById('voice-analysis').style.display = 'none';
    document.getElementById('voice-dot').classList.add('inactive');
  }
});

// ============================================================
//  SLIDERS
// ============================================================

document.getElementById('radius-slider').addEventListener('input', function() {
  interactionRadius = parseInt(this.value);
  document.getElementById('radius-val').textContent = this.value;
});

document.getElementById('friction-slider').addEventListener('input', function() {
  friction = parseInt(this.value) / 100;
  document.getElementById('friction-val').textContent = friction.toFixed(2);
});

document.getElementById('trail-slider').addEventListener('input', function() {
  trailFade = parseInt(this.value) / 100;
  document.getElementById('trail-val').textContent = trailFade.toFixed(2);
});

// ============================================================
//  KEYBOARD SHORTCUTS
// ============================================================

window.addEventListener('keydown', (e) => {
  // Ignore if typing in an input
  if (e.target.tagName === 'INPUT') return;

  const key = e.key.toLowerCase();

  // 1-6: Toggle species visibility
  if (key >= '1' && key <= '6') {
    const idx = parseInt(key) - 1;
    speciesVisible[idx] = !speciesVisible[idx];
    return;
  }

  switch (key) {
    case 'r':
      randomMatrix();
      refreshMatrixUI();
      activePreset = null;
      clearPresetHighlight();
      break;
    case ' ':
      e.preventDefault();
      voiceToggleBtn.click();
      break;
    case 'b':
      triggerBigBang();
      break;
    case 'p':
      paused = !paused;
      document.getElementById('sim-status').textContent = paused ? 'PAUSED' : 'RUNNING';
      document.getElementById('sim-dot').classList.toggle('inactive', paused);
      break;
  }
});

// ============================================================
//  FPS COUNTER
// ============================================================

let fpsFrames = 0;
let fpsTime = performance.now();
let currentFPS = 0;

function updateFPS() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsTime >= 1000) {
    currentFPS = fpsFrames;
    fpsFrames = 0;
    fpsTime = now;
    document.getElementById('fps-display').textContent = `FPS: ${currentFPS} | Particles: ${particles.length}`;
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================

let statsFrame = 0;

function mainLoop(time) {
  requestAnimationFrame(mainLoop);
  updateFPS();

  if (!paused) {
    updatePhysics();
    processVoice();
  }

  // Motion trails - semi-transparent black rect
  ctx.fillStyle = `rgba(10,10,15,${trailFade})`;
  ctx.fillRect(0, 0, W, H);

  // Background stars
  drawStars(time);

  // Connections
  drawConnections();

  // Particles
  drawParticles();

  // Shockwaves
  drawShockwaves();

  // UI updates every 15 frames
  statsFrame++;
  if (statsFrame % 15 === 0) {
    updatePopStats();
    const behavior = detectBehavior();
    document.getElementById('behavior-label').textContent = behavior;
  }

  if (!voiceActive && statsFrame % 10 === 0) {
    updateBottomSpectrum(null);
  }
}

// ============================================================
//  INITIALIZATION
// ============================================================

function init() {
  buildMatrixUI();
  buildSpeciesSliders();
  buildPopStats();
  initGrid();

  // Initial clear
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(mainLoop);
}

window.addEventListener('resize', () => {
  resize();
  initGrid();
});

init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIELD-SOM</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060610; color: #c0c8d8; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; }
#stats {
  position: fixed; top: 16px; right: 16px; background: rgba(6,6,16,0.92);
  border: 1px solid #a8f; border-radius: 6px; padding: 14px 18px;
  font-size: 13px; line-height: 1.7; min-width: 200px; z-index: 10;
}
#stats .title { color: #a8f; font-size: 15px; font-weight: bold; margin-bottom: 6px; }
#stats .val { color: #a8f; }
#controls {
  position: fixed; bottom: 16px; left: 16px; background: rgba(6,6,16,0.92);
  border: 1px solid #a8f; border-radius: 6px; padding: 14px 18px;
  font-size: 13px; z-index: 10; display: flex; flex-direction: column; gap: 8px;
}
#controls button {
  background: rgba(170,136,255,0.13); color: #a8f; border: 1px solid #a8f;
  border-radius: 4px; padding: 6px 14px; font-family: inherit; font-size: 13px;
  cursor: pointer; transition: background 0.2s;
}
#controls button:hover { background: rgba(170,136,255,0.3); }
#controls label { color: #c0c8d8; display: flex; align-items: center; gap: 8px; font-size: 12px; }
#controls input[type=range] { width: 100px; accent-color: #a8f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">
  <div class="title">SHIELD-SOM</div>
  <div>Grid Size: <span class="val" id="sGrid">15x15</span></div>
  <div>Epoch: <span class="val" id="sEpoch">0</span></div>
  <div>Learning Rate: <span class="val" id="sLR">0.500</span></div>
  <div>Radius: <span class="val" id="sRadius">7.50</span></div>
  <div>BMU: <span class="val" id="sBMU">-</span></div>
  <div>Distribution: <span class="val" id="sDist">Ring</span></div>
  <div>State: <span class="val" id="sState">IDLE</span></div>
</div>
<div id="controls">
  <div style="color:#a8f;font-weight:bold;margin-bottom:4px;">Controls</div>
  <button id="btnTrain">Train</button>
  <button id="btnStop">Stop</button>
  <button id="btnReset">Reset Map</button>
  <button id="btnDist">Distribution: Ring</button>
  <label>Speed <input type="range" id="speedSlider" min="1" max="50" value="10"></label>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

const gridSize = 15;
const inputDim = 3; // RGB color space
let map = []; // gridSize x gridSize, each cell has [r,g,b] in [0,1]
let training = false;
let epoch = 0;
let maxEpochs = 1000;
let initLR = 0.5;
let initRadius = gridSize / 2;
let lr = initLR;
let radius = initRadius;
let bmuR = -1, bmuC = -1;
let speed = 10;
let distType = 0; // 0: ring, 1: clusters, 2: uniform
const distNames = ['Ring', 'Clusters', 'Uniform'];

// Initialize map with small random values (starts "folded")
function initMap() {
  map = [];
  for (let r = 0; r < gridSize; r++) {
    map[r] = [];
    for (let c = 0; c < gridSize; c++) {
      map[r][c] = [0.4 + Math.random() * 0.2, 0.4 + Math.random() * 0.2, 0.4 + Math.random() * 0.2];
    }
  }
  epoch = 0; lr = initLR; radius = initRadius;
}
initMap();

// Sample from distribution
function sampleInput() {
  if (distType === 0) {
    // Ring in RGB space
    const angle = Math.random() * Math.PI * 2;
    return [0.5 + 0.4 * Math.cos(angle), 0.5 + 0.4 * Math.sin(angle), 0.5 + 0.4 * Math.sin(angle * 2)];
  } else if (distType === 1) {
    // Clusters
    const centers = [[0.2,0.2,0.8],[0.8,0.2,0.2],[0.2,0.8,0.2],[0.8,0.8,0.2],[0.5,0.2,0.8]];
    const c = centers[Math.floor(Math.random() * centers.length)];
    return [c[0]+Math.random()*0.15-0.075, c[1]+Math.random()*0.15-0.075, c[2]+Math.random()*0.15-0.075].map(v=>Math.max(0,Math.min(1,v)));
  } else {
    return [Math.random(), Math.random(), Math.random()];
  }
}

// Find BMU
function findBMU(input) {
  let bestD = Infinity, br = 0, bc = 0;
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      let d = 0;
      for (let k = 0; k < inputDim; k++) d += (map[r][c][k] - input[k]) ** 2;
      if (d < bestD) { bestD = d; br = r; bc = c; }
    }
  }
  return [br, bc];
}

// Train one step
function trainStep() {
  if (epoch >= maxEpochs) { training = false; return; }
  const input = sampleInput();
  const [br, bc] = findBMU(input);
  bmuR = br; bmuC = bc;

  // Decay
  const t = epoch / maxEpochs;
  lr = initLR * Math.exp(-3 * t);
  radius = Math.max(1, initRadius * Math.exp(-3 * t));

  // Update neighbors
  const r2 = radius * radius;
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const dist2 = (r - br) ** 2 + (c - bc) ** 2;
      if (dist2 > r2 * 4) continue;
      const h = Math.exp(-dist2 / (2 * r2));
      for (let k = 0; k < inputDim; k++) {
        map[r][c][k] += lr * h * (input[k] - map[r][c][k]);
      }
    }
  }
  epoch++;
}

// Controls
document.getElementById('btnTrain').addEventListener('click', () => { training = true; });
document.getElementById('btnStop').addEventListener('click', () => { training = false; });
document.getElementById('btnReset').addEventListener('click', () => { initMap(); training = false; });
document.getElementById('btnDist').addEventListener('click', function() {
  distType = (distType + 1) % 3;
  this.textContent = 'Distribution: ' + distNames[distType];
  initMap();
});
document.getElementById('speedSlider').addEventListener('input', (e) => { speed = parseInt(e.target.value); });

// Particles
const particles = [];
for (let i = 0; i < 30; i++) {
  particles.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*1.5+0.5 });
}

let time = 0;
function draw() {
  requestAnimationFrame(draw);
  time++;
  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, W, H);

  // Particles
  ctx.globalAlpha = 0.1;
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.fillStyle = '#a8f';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Train
  if (training) {
    for (let i = 0; i < speed; i++) trainStep();
  }

  // Grid layout
  const size = Math.min(W - 300, H - 160);
  const s = Math.max(250, Math.min(size, 550));
  const ox = (W - 220) / 2 - s / 2;
  const oy = H / 2 - s / 2;
  const cellW = s / gridSize;
  const cellH = s / gridSize;

  // Title
  ctx.fillStyle = '#a8f';
  ctx.font = 'bold 18px Courier New';
  ctx.fillText('SHIELD-SOM', ox, oy - 26);
  ctx.font = '12px Courier New';
  ctx.fillStyle = '#888';
  ctx.fillText('Self-Organizing Map (Kohonen Network)', ox, oy - 10);

  // Draw map cells
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const v = map[r][c];
      const cr = Math.floor(v[0] * 255);
      const cg = Math.floor(v[1] * 255);
      const cb = Math.floor(v[2] * 255);
      ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
      ctx.fillRect(ox + c * cellW, oy + r * cellH, cellW - 1, cellH - 1);

      // BMU highlight
      if (r === bmuR && c === bmuC && training) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(ox + c * cellW, oy + r * cellH, cellW - 1, cellH - 1);
      }
    }
  }

  // Grid border
  ctx.strokeStyle = '#a8f';
  ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, s, s);

  // Draw connections between neighboring neurons (showing topology)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cx1 = ox + (c + 0.5) * cellW;
      const cy1 = oy + (r + 0.5) * cellH;
      if (c < gridSize - 1) {
        const cx2 = ox + (c + 1.5) * cellW;
        ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx2, cy1); ctx.stroke();
      }
      if (r < gridSize - 1) {
        const cy2 = oy + (r + 1.5) * cellH;
        ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx1, cy2); ctx.stroke();
      }
    }
  }

  // Training progress bar
  const pbx = ox, pby = oy + s + 20, pbw = s, pbh = 10;
  ctx.fillStyle = 'rgba(30,30,60,0.8)';
  ctx.fillRect(pbx, pby, pbw, pbh);
  ctx.fillStyle = 'rgba(170,136,255,0.6)';
  ctx.fillRect(pbx, pby, pbw * (epoch / maxEpochs), pbh);
  ctx.strokeStyle = 'rgba(170,136,255,0.3)';
  ctx.strokeRect(pbx, pby, pbw, pbh);
  ctx.fillStyle = '#888';
  ctx.font = '10px Courier New';
  ctx.fillText(`Training Progress: ${epoch}/${maxEpochs}`, pbx, pby + 22);

  // Radius visualization (small diagram)
  const diagX = ox, diagY = oy + s + 55, diagS = 80;
  ctx.fillStyle = '#888';
  ctx.font = '11px Courier New';
  ctx.fillText('Neighborhood Radius:', diagX, diagY);
  ctx.strokeStyle = 'rgba(170,136,255,0.3)';
  ctx.beginPath();
  ctx.arc(diagX + diagS / 2, diagY + diagS / 2 + 10, Math.max(2, radius / gridSize * diagS / 2), 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#a8f';
  ctx.beginPath();
  ctx.arc(diagX + diagS / 2, diagY + diagS / 2 + 10, 3, 0, Math.PI * 2);
  ctx.fill();

  // Sample data visualization
  const sdX = ox + 120, sdY = oy + s + 55;
  ctx.fillStyle = '#888';
  ctx.font = '11px Courier New';
  ctx.fillText('Input Distribution:', sdX, sdY);
  for (let i = 0; i < 30; i++) {
    const sample = sampleInput();
    ctx.fillStyle = `rgb(${Math.floor(sample[0]*255)},${Math.floor(sample[1]*255)},${Math.floor(sample[2]*255)})`;
    ctx.beginPath();
    ctx.arc(sdX + 10 + i % 10 * 12, sdY + 15 + Math.floor(i / 10) * 12, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Stats
  document.getElementById('sEpoch').textContent = epoch;
  document.getElementById('sLR').textContent = lr.toFixed(4);
  document.getElementById('sRadius').textContent = radius.toFixed(2);
  document.getElementById('sBMU').textContent = bmuR >= 0 ? `(${bmuR},${bmuC})` : '-';
  document.getElementById('sDist').textContent = distNames[distType];
  document.getElementById('sState').textContent = training ? 'TRAINING' : (epoch >= maxEpochs ? 'DONE' : 'IDLE');
}
draw();
</script>
</body>
</html>
